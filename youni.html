<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>由你积分</title>
<link rel="stylesheet" href="common.css">
<style>
  table { min-width: 600px; }
  /* 删除按钮 */
  .del-btn {
    width: 24px; height: 24px; border-radius: 50%;
    border: 1px solid rgba(231,76,60,0.35);
    background: white; color: #e74c3c; font-size: 14px; line-height: 1;
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
    transition: 0.15s; font-family: inherit; padding: 0;
  }
  .del-btn:hover { background: rgba(231,76,60,0.1); border-color: #e74c3c; }
</style>
</head>
<body>
  <div class="stats-row">
    <div class="stat-card"><div class="s-label">当前总分</div><div class="s-value" id="totalScore">0</div></div>
    <div class="stat-card done"><div class="s-label">已完成账号</div><div class="s-value" id="doneAccounts">0 / 0</div></div>
    <div class="stat-card done"><div class="s-label">已完成平台</div><div class="s-value" id="donePlatforms">0 / 5</div></div>
  </div>

  <div class="toolbar">
    <button id="importBtn">读取 CSV</button>
    <button id="exportBtn">导出 CSV</button>
    <button id="clearDataBtn" class="danger">清空数据</button>
  </div>

  <div class="table-box" id="tableBox"></div>
  <input type="file" id="fileInput" accept=".csv,text/csv">

<script>
(function(){
  const PLATFORMS = ['q音', '酷狗', '酷我', '波点', '波点2'];
  const DONE_THRESHOLD = 1;
  const MODULE_TITLE = '由你积分';
  const DATA_STORAGE_KEY = 'bang_youni_scores';

  let ACCOUNTS = [];
  let data = {};

  function todayStr() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function normalizeName(name) { return String(name).trim().replace(/\s+/g, ' '); }

  function notifyResize() {
    if (window.parent && window.parent !== window) {
      try {
        window.parent.postMessage({
          type: 'resize',
          module: 'youni',
          height: document.body.scrollHeight
        }, '*');
      } catch(e) {}
    }
  }

  function requestDeleteAccount(name) {
    if (window.parent && window.parent !== window) {
      try {
        window.parent.postMessage({ type: 'delete-account', account: name }, '*');
      } catch(e) {}
    }
  }

  function loadData() {
    try {
      const raw = localStorage.getItem(DATA_STORAGE_KEY);
      if (raw) { const obj = JSON.parse(raw); if (obj && typeof obj === 'object') return obj; }
    } catch(e) {}
    return {};
  }
  function saveData() { localStorage.setItem(DATA_STORAGE_KEY, JSON.stringify(data)); }

  function syncDataWithAccounts() {
    const normalizedData = {};
    Object.keys(data).forEach(k => {
      const nk = normalizeName(k);
      if (!normalizedData[nk]) normalizedData[nk] = data[k];
    });
    data = normalizedData;
    ACCOUNTS.forEach(a => {
      if (!data[a]) data[a] = {};
      PLATFORMS.forEach(p => { if (data[a][p] === undefined) data[a][p] = ''; });
    });
    Object.keys(data).forEach(a => { if (!ACCOUNTS.includes(a)) delete data[a]; });
    ACCOUNTS = [...new Set(ACCOUNTS)];
  }

  function renderAll() {
    const box = document.getElementById('tableBox');
    let rows = '';
    if (ACCOUNTS.length === 0) {
      rows = `<tr class="empty-row"><td colspan="${PLATFORMS.length + 2}">当前无账号，请在顶部「统一账号」输入框中添加</td></tr>`;
    } else {
      rows = ACCOUNTS.map((a) => `
        <tr data-acc="${escapeHtml(a)}">
          <td class="account-cell" title="${escapeHtml(a)}"><span class="account-text">${escapeHtml(a)}</span></td>
          ${PLATFORMS.map(p => {
            const val = (data[a] && data[a][p]) ? data[a][p] : '';
            return `<td><div class="cell-inner"><input class="score" type="number" min="0" step="1" placeholder="—" data-acc="${escapeHtml(a)}" data-pf="${escapeHtml(p)}" value="${escapeHtml(val)}"></div></td>`;
          }).join('')}
          <td><button class="del-btn" data-acc="${escapeHtml(a)}" title="删除该账号">×</button></td>
        </tr>
      `).join('');
    }

    box.innerHTML = `<table>
      <colgroup>
        <col style="width:100px">
        <col style="width:15%"><col style="width:15%"><col style="width:15%"><col style="width:15%"><col style="width:15%">
        <col style="width:40px">
      </colgroup>
      <thead><tr><th style="text-align:left;padding-left:6px;">账号</th>${PLATFORMS.map(p => `<th>${p}</th>`).join('')}<th>操作</th></tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr><td class="account-cell" style="color:#ea3690;">平台合计</td>${PLATFORMS.map((_, i) => `<td><div class="col-total" id="ct-${i}">0</div></td>`).join('')}<td></td></tr></tfoot>
    </table>`;

    box.querySelectorAll('input.score').forEach(inp => {
      inp.addEventListener('input', function(){
        const a = this.dataset.acc, p = this.dataset.pf;
        if (!data[a]) data[a] = {};
        data[a][p] = this.value;
        saveData();
        updateStats();
        notifyResize();
      });
    });

    box.querySelectorAll('.del-btn').forEach(btn => {
      btn.addEventListener('click', function(){
        requestDeleteAccount(this.dataset.acc);
      });
    });

    updateStats();
    notifyResize();
  }

  function updateStats() {
    let grand = 0;
    const colTotals = PLATFORMS.map(() => 0);
    const colFilled = PLATFORMS.map(() => 0);
    let doneAcc = 0;
    ACCOUNTS.forEach(a => {
      let filled = 0;
      PLATFORMS.forEach((p, idx) => {
        const raw = (data[a] && data[a][p] !== undefined) ? data[a][p] : '';
        const n = parseInt(raw, 10);
        const val = isNaN(n) ? 0 : n;
        grand += val; colTotals[idx] += val;
        if (!isNaN(n) && n >= DONE_THRESHOLD) { filled++; colFilled[idx]++; }
      });
      if (filled === PLATFORMS.length) doneAcc++;
    });
    PLATFORMS.forEach((_, idx) => { const el = document.getElementById(`ct-${idx}`); if (el) el.textContent = colTotals[idx]; });
    let donePf = 0;
    colFilled.forEach(c => { if (c === ACCOUNTS.length && ACCOUNTS.length > 0) donePf++; });
    const t = document.getElementById('totalScore'); if (t) t.textContent = grand.toLocaleString();
    const da = document.getElementById('doneAccounts'); if (da) da.textContent = `${doneAcc} / ${ACCOUNTS.length}`;
    const dp = document.getElementById('donePlatforms'); if (dp) dp.textContent = `${donePf} / ${PLATFORMS.length}`;

    notifyResize();
  }

  function clearAllScores() {
    if (!ACCOUNTS.length) { alert('当前没有账号，无需清空数据'); return; }
    let has = false;
    ACCOUNTS.forEach(a => PLATFORMS.forEach(p => { if (data[a] && data[a][p] && String(data[a][p]).trim() !== '') has = true; }));
    if (!has) { alert('当前所有账号数据已经是空的'); return; }
    if (!confirm('确定要清空所有账号的分值数据吗？账号列表将保留，但所有平台的分数会被重置为空。')) return;
    ACCOUNTS.forEach(a => { if (!data[a]) data[a] = {}; PLATFORMS.forEach(p => data[a][p] = ''); });
    saveData();
    renderAll();
  }

  function exportCSV() {
    if (!ACCOUNTS.length) { alert('当前没有账号，无法导出'); return; }
    const rows = [['账号', ...PLATFORMS].join(',')];
    const colTotals = PLATFORMS.map(() => 0);
    ACCOUNTS.forEach(a => {
      const cells = [a];
      PLATFORMS.forEach((p, idx) => {
        const raw = (data[a] && data[a][p] !== undefined) ? data[a][p] : '';
        const n = parseInt(raw, 10);
        const val = isNaN(n) ? '' : n;
        cells.push(val);
        if (!isNaN(n)) colTotals[idx] += n;
      });
      rows.push(cells.join(','));
    });
    rows.push(['平台合计', ...colTotals].join(','));
    const csv = '\uFEFF' + rows.join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `${MODULE_TITLE}_${todayStr()}.csv`; a.click();
    URL.revokeObjectURL(url);
  }

  function parseCSVLine(line) {
    const result = []; let cur = ''; let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (inQuotes) {
        if (ch === '"') { if (line[i+1] === '"') { cur += '"'; i++; } else inQuotes = false; }
        else cur += ch;
      } else {
        if (ch === '"') inQuotes = true;
        else if (ch === ',') { result.push(cur); cur = ''; }
        else cur += ch;
      }
    }
    result.push(cur); return result;
  }

  function importCSV(file) {
    const reader = new FileReader();
    reader.onload = e => {
      try {
        let text = e.target.result;
        if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
        const lines = text.split(/\r?\n/).filter(l => l.trim() !== '');
        if (lines.length < 2) { alert('CSV 内容为空或格式不正确'); return; }
        const header = parseCSVLine(lines[0]).map(s => s.trim());
        const platformCol = {};
        PLATFORMS.forEach(pf => { const idx = header.indexOf(pf); if (idx !== -1) platformCol[pf] = idx; });
        if (Object.keys(platformCol).length === 0) { alert('CSV 表头中没有找到平台列（q音/酷狗/酷我/波点/波点2）'); return; }

        const importedData = {};
        for (let i = 1; i < lines.length; i++) {
          const cells = parseCSVLine(lines[i]);
          const rawName = cells[0] ? cells[0].trim() : '';
          if (!rawName || rawName === '平台合计') continue;
          const accName = normalizeName(rawName);
          if (!importedData[accName]) importedData[accName] = {};
          PLATFORMS.forEach(pf => {
            const colIdx = platformCol[pf]; let val = '';
            if (colIdx !== undefined && colIdx < cells.length) {
              const raw = cells[colIdx].trim();
              if (raw !== '') { const n = parseInt(raw, 10); val = isNaN(n) ? '' : String(Math.max(0, n)); }
            }
            importedData[accName][pf] = val;
          });
        }
        if (Object.keys(importedData).length === 0) { alert('没有在 CSV 中解析到有效账号，请检查第一列是否为账号名'); return; }

        data = {};
        ACCOUNTS.forEach(a => {
          data[a] = {};
          PLATFORMS.forEach(p => {
            data[a][p] = (importedData[a] && importedData[a][p] !== undefined) ? importedData[a][p] : '';
          });
        });
        saveData(); renderAll();
        alert('导入完成（已按当前统一账号列表匹配数据）');
      } catch(err) { console.error(err); alert('CSV 解析失败：' + err.message); }
    };
    reader.readAsText(file, 'UTF-8');
  }

  window.addEventListener('message', function(e) {
    if (!e.data || e.data.type !== 'accounts-changed') return;
    const incoming = Array.isArray(e.data.accounts) ? e.data.accounts : [];
    ACCOUNTS = incoming.filter(x => typeof x === 'string' && x.trim() !== '').map(normalizeName);
    data = loadData();
    syncDataWithAccounts();
    saveData();
    renderAll();
  });

  function init() {
    data = loadData();
    renderAll();
    document.getElementById('importBtn').addEventListener('click', () => {
      const fi = document.getElementById('fileInput');
      fi.value = ''; fi.click();
    });
    document.getElementById('fileInput').addEventListener('change', e => {
      const f = e.target.files[0]; if (f) importCSV(f);
    });
    document.getElementById('exportBtn').addEventListener('click', exportCSV);
    document.getElementById('clearDataBtn').addEventListener('click', clearAllScores);
  }
  init();
})();
</script>
</body>
</html>
