<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>由你积分</title>
<link rel="stylesheet" href="common.css">
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
  table { min-width: 640px; }

  .platform-cell {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    min-height: 38px;
    padding: 2px 0;
  }

  .platform-cell input.score {
    margin: 0;
    width: 56px;
    max-width: 56px;
    flex: 0 0 56px;
  }

  .daily-check {
    width: 18px;
    height: 18px;
    border-radius: 5px;
    border: 1.5px solid #f0d6e4;
    background: white;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: 0.15s;
    font-size: 11px;
    color: transparent;
    font-weight: bold;
    user-select: none;
    flex: 0 0 18px;
  }
  .daily-check:hover { border-color: #f97316; }
  .daily-check.checked {
    background: #f97316;
    border-color: #f97316;
    color: #fff;
  }

  .col-total-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    width: 100%;
  }
  .col-total-wrap .col-total {
    width: 56px;
    flex: 0 0 56px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .col-total-wrap .total-spacer {
    width: 18px;
    flex: 0 0 18px;
  }

  .del-btn {
    width: 24px; height: 24px; border-radius: 50%;
    border: 1px solid rgba(231,76,60,0.35);
    background: white; color: #e74c3c; font-size: 14px; line-height: 1;
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
    transition: 0.15s; font-family: inherit; padding: 0;
  }
  .del-btn:hover { background: rgba(231,76,60,0.1); border-color: #e74c3c; }

  .stats-row.two {
    grid-template-columns: repeat(2, 1fr);
  }
</style>
</head>
<body>
  <div class="stats-row two">
    <div class="stat-card"><div class="s-label">当前总分</div><div class="s-value" id="totalScore">0</div></div>
    <div class="stat-card done"><div class="s-label">已打投账号</div><div class="s-value" id="doneCount">0 / 0</div></div>
  </div>

  <div class="toolbar">
    <button id="clearScoresBtn" class="danger">清空积分</button>
    <button id="clearTasksBtn" class="danger">清空任务</button>
  </div>

  <div class="table-box" id="tableBox"></div>

<script>
(function(){
  const PLATFORMS = ['q音', '酷狗', '酷我', '波点', '波点2'];
  const DATA_STORAGE_KEY = 'bang_youni_scores';

  let ACCOUNTS = [];
  let data = {};
  let daily = {};
  let dailyDate = '';

  function todayStr() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function normalizeName(name) { return String(name).trim().replace(/\s+/g, ' '); }

  function notifyResize() {
    if (window.parent && window.parent !== window) {
      try {
        window.parent.postMessage({
          type: 'resize',
          module: 'youni',
          height: document.body.scrollHeight
        }, '*');
      } catch(e) {}
    }
  }

  function requestDeleteAccount(name) {
    if (window.parent && window.parent !== window) {
      try {
        window.parent.postMessage({ type: 'delete-account', account: name }, '*');
      } catch(e) {}
    }
  }

  function loadData() {
    try {
      const raw = localStorage.getItem(DATA_STORAGE_KEY);
      if (raw) {
        const obj = JSON.parse(raw);
        if (obj && typeof obj === 'object') {
          if (obj.scores && typeof obj.scores === 'object') {
            return {
              scores: obj.scores,
              daily: obj.daily || {},
              dailyDate: typeof obj.dailyDate === 'string' ? obj.dailyDate : ''
            };
          }
          return { scores: obj, daily: {}, dailyDate: '' };
        }
      }
    } catch(e) {}
    return { scores: {}, daily: {}, dailyDate: '' };
  }
  function saveData() {
    localStorage.setItem(DATA_STORAGE_KEY, JSON.stringify({
      scores: data,
      daily: daily,
      dailyDate: dailyDate
    }));
  }

  // 跨天检查：只改数据，不重建表格
  function checkDailyReset() {
    const today = todayStr();
    if (dailyDate === today) return false;

    ACCOUNTS.forEach(a => {
      if (!daily[a]) daily[a] = {};
      PLATFORMS.forEach(p => { daily[a][p] = false; });
    });
    dailyDate = today;
    saveData();
    return true;
  }

  // 只清空页面上的勾选框 DOM，不动 input 和账号列
  function clearDailyChecksDom() {
    document.querySelectorAll('.daily-check').forEach(el => {
      el.classList.remove('checked');
      el.textContent = '';
    });
    updateStats();
  }

  function syncDataWithAccounts() {
    const normalizedScores = {};
    Object.keys(data).forEach(k => {
      const nk = normalizeName(k);
      if (!normalizedScores[nk]) normalizedScores[nk] = data[k];
    });
    data = normalizedScores;

    const normalizedDaily = {};
    Object.keys(daily).forEach(k => {
      const nk = normalizeName(k);
      if (!normalizedDaily[nk]) normalizedDaily[nk] = daily[k];
    });
    daily = normalizedDaily;

    ACCOUNTS.forEach(a => {
      if (!data[a]) data[a] = {};
      if (!daily[a]) daily[a] = {};
      PLATFORMS.forEach(p => {
        if (data[a][p] === undefined) data[a][p] = '';
        if (daily[a][p] === undefined) daily[a][p] = false;
      });
    });
    Object.keys(data).forEach(a => { if (!ACCOUNTS.includes(a)) delete data[a]; });
    Object.keys(daily).forEach(a => { if (!ACCOUNTS.includes(a)) delete daily[a]; });
    ACCOUNTS = [...new Set(ACCOUNTS)];
  }

  function renderAll() {
    const box = document.getElementById('tableBox');
    let rows = '';
    if (ACCOUNTS.length === 0) {
      rows = `<tr class="empty-row"><td colspan="${PLATFORMS.length + 2}">当前无账号，请在顶部「统一账号」输入框中添加</td></tr>`;
    } else {
      rows = ACCOUNTS.map((a) => `
        <tr data-acc="${escapeHtml(a)}">
          <td class="account-cell" title="${escapeHtml(a)}"><span class="account-text">${escapeHtml(a)}</span></td>
          ${PLATFORMS.map(p => {
            const val = (data[a] && data[a][p]) ? data[a][p] : '';
            const isDone = !!(daily[a] && daily[a][p]);
            return `<td>
              <div class="platform-cell">
                <input class="score" type="number" min="0" step="1" placeholder="—" data-acc="${escapeHtml(a)}" data-pf="${escapeHtml(p)}" value="${escapeHtml(val)}">
                <div class="daily-check ${isDone ? 'checked' : ''}" data-acc="${escapeHtml(a)}" data-pf="${escapeHtml(p)}" title="${isDone ? '点击取消每日任务' : '点击标记每日任务完成'}">${isDone ? '✓' : ''}</div>
              </div>
            </td>`;
          }).join('')}
          <td><button class="del-btn" data-acc="${escapeHtml(a)}" title="删除该账号">×</button></td>
        </tr>
      `).join('');
    }

    const footCells = PLATFORMS.map((_, i) => `
      <td>
        <div class="col-total-wrap">
          <div class="col-total" id="ct-${i}">0</div>
          <div class="total-spacer"></div>
        </div>
      </td>
    `).join('');

    box.innerHTML = `<table>
      <colgroup>
        <col style="width:88px">
        <col style="width:auto"><col style="width:auto"><col style="width:auto"><col style="width:auto"><col style="width:auto">
        <col style="width:36px">
      </colgroup>
      <thead><tr><th style="text-align:left;padding-left:6px;">账号</th>${PLATFORMS.map(p => `<th>${p}</th>`).join('')}<th>操作</th></tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr><td class="account-cell" style="color:#ea3690;">合计</td>${footCells}<td></td></tr></tfoot>
    </table>`;

    box.querySelectorAll('input.score').forEach(inp => {
      inp.addEventListener('input', function(){
        const a = this.dataset.acc, p = this.dataset.pf;
        if (!data[a]) data[a] = {};
        data[a][p] = this.value;
        saveData();
        updateStats();
        notifyResize();
      });
    });

    box.querySelectorAll('.daily-check').forEach(el => {
      el.addEventListener('click', function(){
        const a = this.dataset.acc, p = this.dataset.pf;
        if (!daily[a]) daily[a] = {};
        daily[a][p] = !daily[a][p];
        if (dailyDate !== todayStr()) dailyDate = todayStr();
        this.classList.toggle('checked');
        this.textContent = daily[a][p] ? '✓' : '';
        saveData();
        updateStats();
        notifyResize();
      });
    });

    box.querySelectorAll('.del-btn').forEach(btn => {
      btn.addEventListener('click', function(){
        requestDeleteAccount(this.dataset.acc);
      });
    });

    updateStats();
    notifyResize();
  }

  function updateStats() {
    let grand = 0;
    const colTotals = PLATFORMS.map(() => 0);
    let checkedCount = 0;

    ACCOUNTS.forEach(a => {
      PLATFORMS.forEach((p, idx) => {
        const raw = (data[a] && data[a][p] !== undefined) ? data[a][p] : '';
        const n = parseInt(raw, 10);
        const val = isNaN(n) ? 0 : n;
        grand += val;
        colTotals[idx] += val;
        if (daily[a] && daily[a][p]) checkedCount++;
      });
    });

    PLATFORMS.forEach((_, idx) => {
      const el = document.getElementById(`ct-${idx}`);
      if (el) el.textContent = colTotals[idx];
    });

    const t = document.getElementById('totalScore');
    if (t) t.textContent = grand.toLocaleString();

    const total = ACCOUNTS.length * PLATFORMS.length;
    const d = document.getElementById('doneCount');
    if (d) d.textContent = `${checkedCount} / ${total}`;

    notifyResize();
  }

  function clearScores() {
    if (!ACCOUNTS.length) { alert('当前没有账号，无需清空积分'); return; }
    let has = false;
    ACCOUNTS.forEach(a => {
      PLATFORMS.forEach(p => {
        if (data[a] && data[a][p] && String(data[a][p]).trim() !== '') has = true;
      });
    });
    if (!has) { alert('当前所有积分已经是空的'); return; }
    if (!confirm('确定要清空所有账号的积分吗？每日任务勾选会保留。')) return;
    ACCOUNTS.forEach(a => {
      if (!data[a]) data[a] = {};
      PLATFORMS.forEach(p => { data[a][p] = ''; });
    });
    saveData();
    // 只清空输入框，不重建表格
    document.querySelectorAll('input.score').forEach(inp => { inp.value = ''; });
    updateStats();
    notifyResize();
  }

  function clearTasks() {
    if (!ACCOUNTS.length) { alert('当前没有账号，无需清空任务'); return; }
    let has = false;
    ACCOUNTS.forEach(a => {
      PLATFORMS.forEach(p => {
        if (daily[a] && daily[a][p]) has = true;
      });
    });
    if (!has) { alert('当前所有每日任务勾选已经是空的'); return; }
    if (!confirm('确定要清空所有账号的每日任务勾选吗？积分会保留。')) return;
    ACCOUNTS.forEach(a => {
      if (!daily[a]) daily[a] = {};
      PLATFORMS.forEach(p => { daily[a][p] = false; });
    });
    dailyDate = todayStr();
    saveData();
    clearDailyChecksDom();
  }

  window.addEventListener('message', function(e) {
    if (!e.data || e.data.type !== 'accounts-changed') return;
    const incoming = Array.isArray(e.data.accounts) ? e.data.accounts : [];
    ACCOUNTS = incoming.filter(x => typeof x === 'string' && x.trim() !== '').map(normalizeName);
    const loaded = loadData();
    data = loaded.scores;
    daily = loaded.daily;
    dailyDate = loaded.dailyDate;
    syncDataWithAccounts();
    if (checkDailyReset()) {
      // 跨天：只清勾选框，不重建表格
      clearDailyChecksDom();
    }
    renderAll();
  });

  // ===== 截图响应（账号打码 ***） =====
  window.addEventListener('message', async function(e) {
    if (!e.data || e.data.type !== 'capture') return;
    try {
      const statsRow = document.querySelector('.stats-row');
      const tableBox = document.querySelector('.table-box');
      if (!statsRow || !tableBox) {
        window.parent.postMessage({ type: 'capture-result', dataURL: null }, '*');
        return;
      }

      // 克隆统计卡片
      const statsClone = statsRow.cloneNode(true);

      // 克隆表格
      const tableClone = tableBox.cloneNode(true);
      tableClone.querySelectorAll('tbody tr').forEach((tr, idx) => {
        const accountText = tr.querySelector('.account-text');
        if (accountText) accountText.textContent = `${idx + 1}.***`;
      });
      tableClone.querySelectorAll('.account-cell').forEach(el => {
        el.removeAttribute('title');
      });
      tableClone.querySelectorAll('[data-acc]').forEach(el => {
        el.setAttribute('data-acc', '***');
      });
      tableClone.scrollLeft = 0;
      tableClone.style.maxHeight = 'none';
      tableClone.style.overflowY = 'visible';

      // 临时容器：宽度至少 800，保证移动端也能完整渲染
      const wrapper = document.createElement('div');
      wrapper.style.background = '#fff';
      wrapper.style.padding = '8px';
      wrapper.style.width = Math.max(tableBox.scrollWidth || 0, 800) + 'px';
      wrapper.style.position = 'fixed';
      wrapper.style.left = '-99999px';
      wrapper.style.top = '0';
      wrapper.style.zIndex = '-1';
      wrapper.appendChild(statsClone);
      wrapper.appendChild(tableClone);
      document.body.appendChild(wrapper);

      // 等一帧让布局稳定
      await new Promise(r => setTimeout(r, 50));

      const canvas = await html2canvas(wrapper, {
        backgroundColor: '#ffffff',
        scale: 2,
        useCORS: true,
        logging: false,
        width: wrapper.scrollWidth,
        height: wrapper.scrollHeight
      });

      document.body.removeChild(wrapper);

      const dataURL = canvas.toDataURL('image/png');
      window.parent.postMessage({ type: 'capture-result', dataURL: dataURL }, '*');
    } catch(err) {
      console.error('capture failed', err);
      window.parent.postMessage({ type: 'capture-result', dataURL: null }, '*');
    }
  });

  function init() {
    const loaded = loadData();
    data = loaded.scores;
    daily = loaded.daily;
    dailyDate = loaded.dailyDate;

    syncDataWithAccounts();
    if (checkDailyReset()) {
      // 初始化时跨天，先加载表格，再清勾选框
      renderAll();
      clearDailyChecksDom();
    } else {
      renderAll();
    }

    document.getElementById('clearScoresBtn').addEventListener('click', clearScores);
    document.getElementById('clearTasksBtn').addEventListener('click', clearTasks);

    setInterval(() => {
      if (checkDailyReset()) {
        clearDailyChecksDom();
      }
    }, 60 * 1000);

    document.addEventListener('visibilitychange', function() {
      if (!document.hidden) {
        if (checkDailyReset()) {
          clearDailyChecksDom();
        }
      }
    });
  }
  init();
})();
</script>
</body>
</html>
