<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>电力</title>
<link rel="stylesheet" href="common.css">
<style>
  .check-cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    min-height: 38px;
  }
  .check-box {
    width: 22px;
    height: 22px;
    border-radius: 6px;
    border: 2px solid #f0d6e4;
    background: white;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: 0.15s;
    font-size: 14px;
    color: transparent;
    font-weight: bold;
    user-select: none;
    flex-shrink: 0;
  }
  .check-box:hover { border-color: #ea3690; }
  .check-box.checked { background: #ea3690; border-color: #ea3690; color: #fff; }

  .daily-check {
    width: 22px;
    height: 22px;
    border-radius: 6px;
    border: 2px solid #f0d6e4;
    background: white;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: 0.15s;
    font-size: 14px;
    color: transparent;
    font-weight: bold;
    user-select: none;
  }
  .daily-check:hover { border-color: #f97316; }
  .daily-check.checked { background: #f97316; border-color: #f97316; color: #fff; }

  .shared-cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    min-height: 38px;
  }

  .timer-text {
    display: block;
    font-size: 9px;
    font-weight: bold;
    white-space: nowrap;
    line-height: 12px;
    height: 12px;
    min-height: 12px;
    color: #f97316;
    font-variant-numeric: tabular-nums;
  }
  .timer-text.idle { color: #c7c7c7; }
  .timer-text.ready { color: #22c55e; }

  input.remark-input {
    width: 100%;
    max-width: 110px;
    height: 26px;
    padding: 0 6px;
    text-align: left;
    background: white;
    border: 1px solid #f0d6e4;
    border-radius: 6px;
    color: #555;
    font-size: 11px;
    font-family: inherit;
    outline: none;
    transition: 0.15s;
  }
  input.remark-input:focus {
    border-color: #ea3690;
    box-shadow: 0 0 0 2px rgba(234,54,144,0.12);
  }
  input.remark-input::placeholder { color: #ccc; }

  .disable-check {
    width: 20px;
    height: 20px;
    border-radius: 5px;
    border: 2px solid #f0d6e4;
    background: white;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: 0.15s;
    font-size: 12px;
    color: transparent;
    font-weight: bold;
    user-select: none;
  }
  .disable-check:hover { border-color: #f97316; }
  .disable-check.checked { background: #f97316; border-color: #f97316; color: #fff; }

  .del-btn {
    width: 24px; height: 24px; border-radius: 50%;
    border: 1px solid rgba(231,76,60,0.35);
    background: white; color: #e74c3c; font-size: 14px; line-height: 1;
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
    transition: 0.15s; font-family: inherit; padding: 0;
  }
  .del-btn:hover { background: rgba(231,76,60,0.1); border-color: #e74c3c; }

  tr.row-disabled .account-text {
    color: #bbb;
    text-decoration: line-through;
  }
  tr.row-disabled .remark-input {
    background: #fafafa;
    color: #bbb;
  }

  .check-box.disabled,
  .daily-check.disabled {
    background: #f3f3f3;
    border-color: #e0e0e0;
    cursor: not-allowed;
    pointer-events: none;
    color: transparent;
  }
  .check-box.checked.disabled,
  .daily-check.checked.disabled {
    background: #d9d9d9;
    border-color: #d0d0d0;
    color: #fff;
  }

  /* 顶部两张卡片 */
  .stats-row.two {
    grid-template-columns: repeat(2, 1fr);
  }
</style>
</head>
<body>
  <div class="stats-row two">
    <div class="stat-card done"><div class="s-label">已完成账号</div><div class="s-value" id="powerDoneAccounts">0 / 0</div></div>
    <div class="stat-card done"><div class="s-label">下一轮时间</div><div class="s-value" id="powerNextTime" style="font-size:13px;">—</div></div>
  </div>

  <div class="toolbar">
    <button id="powerClearDataBtn" class="danger">清空数据</button>
    <button id="powerResetRoundBtn">重置轮次</button>
  </div>

  <div class="table-box" id="powerTableBox"></div>

<script>
(function(){
  const SHARED = '盲盒';
  const DAILY_PLATFORMS = ['安卓', '苹果'];
  const POWER_INTERVAL_MS = 4 * 60 * 60 * 1000;
  const POWER_STORAGE_KEY = 'bang_power_state';

  let ACCOUNTS = [];
  let records = {};
  let dailyDate = '';
  let timerInterval = null;

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function normalizeName(name) { return String(name).trim().replace(/\s+/g, ' '); }
  function pad2(n) { return String(n).padStart(2, '0'); }
  function formatTime(ts) {
    const d = new Date(ts);
    return `${pad2(d.getMonth()+1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;
  }
  function formatCountdown(ms) {
    if (ms <= 0) return '可做';
    const totalSec = Math.floor(ms / 1000);
    const h = Math.floor(totalSec / 3600);
    const m = Math.floor((totalSec % 3600) / 60);
    const s = totalSec % 60;
    return `${pad2(h)}:${pad2(m)}:${pad2(s)}`;
  }
  const IDLE_TEXT = '00:00:00';

  function todayStr() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  function getNextAvailableTs(ts) {
    if (!ts || ts <= 0) return 0;
    const after4h = ts + POWER_INTERVAL_MS;
    const d = new Date(ts);
    const nextMidnight = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1, 0, 0, 0, 0).getTime();
    return Math.min(after4h, nextMidnight);
  }
  function getSharedStatus(r) {
    if (!r || !r.done) return { done: false, ready: true, remaining: 0, nextTs: 0 };
    const nextTs = getNextAvailableTs(r.ts);
    const remaining = nextTs - Date.now();
    return { done: true, ready: remaining <= 0, remaining: Math.max(0, remaining), nextTs };
  }

  function notifyResize() {
    if (window.parent && window.parent !== window) {
      try {
        window.parent.postMessage({
          type: 'resize',
          module: 'power',
          height: document.body.scrollHeight
        }, '*');
      } catch(e) {}
    }
  }

  function requestDeleteAccount(name) {
    if (window.parent && window.parent !== window) {
      try {
        window.parent.postMessage({ type: 'delete-account', account: name }, '*');
      } catch(e) {}
    }
  }

  function loadPowerState() {
    try {
      const raw = localStorage.getItem(POWER_STORAGE_KEY);
      if (raw) {
        const obj = JSON.parse(raw);
        if (obj && typeof obj === 'object' && obj.records && typeof obj.records === 'object') {
          return {
            records: obj.records,
            dailyDate: typeof obj.dailyDate === 'string' ? obj.dailyDate : ''
          };
        }
      }
    } catch(e) {}
    return { records: {}, dailyDate: '' };
  }
  function savePowerRecords() {
    localStorage.setItem(POWER_STORAGE_KEY, JSON.stringify({ records, dailyDate }));
  }

  function checkDailyReset() {
    const today = todayStr();
    if (dailyDate === today) return false;

    ACCOUNTS.forEach(a => {
      if (!records[a]) records[a] = {};
      DAILY_PLATFORMS.forEach(p => { records[a][p] = false; });
    });
    dailyDate = today;
    savePowerRecords();
    return true;
  }

  function syncRecordsWithAccounts() {
    const normalized = {};
    Object.keys(records).forEach(k => {
      const nk = normalizeName(k);
      if (!normalized[nk]) normalized[nk] = records[k];
    });
    records = normalized;

    ACCOUNTS.forEach(a => {
      if (!records[a]) records[a] = {};
      DAILY_PLATFORMS.forEach(p => {
        if (typeof records[a][p] !== 'boolean') records[a][p] = false;
      });
      if (!records[a][SHARED] || typeof records[a][SHARED] !== 'object') {
        records[a][SHARED] = { done: false, ts: 0 };
      }
      if (typeof records[a].disabled !== 'boolean') records[a].disabled = false;
      if (typeof records[a].remark !== 'string') records[a].remark = '';
    });
    Object.keys(records).forEach(a => { if (!ACCOUNTS.includes(a)) delete records[a]; });
    ACCOUNTS = [...new Set(ACCOUNTS)];
  }

  function dailyCheckHtml(acc, pf, checked, disabled) {
    const cls = 'daily-check' + (checked ? ' checked' : '') + (disabled ? ' disabled' : '');
    return `<div class="${cls}" data-acc="${escapeHtml(acc)}" data-pf="${escapeHtml(pf)}" data-type="daily" title="${disabled ? '该账号电力不可用' : (checked ? '点击取消' : '点击标记完成')}">${checked ? '✓' : ''}</div>`;
  }

  function sharedHtml(acc, r, disabled) {
    const st = getSharedStatus(r);
    const checked = st.done;
    const cls = 'check-box' + (checked ? ' checked' : '') + (disabled ? ' disabled' : '');
    let timer = '';
    if (disabled) {
      timer = `<span class="timer-text idle" data-timer="${escapeHtml(acc)}|${SHARED}">—</span>`;
    } else if (!st.done) {
      timer = `<span class="timer-text idle" data-timer="${escapeHtml(acc)}|${SHARED}">${IDLE_TEXT}</span>`;
    } else if (st.ready) {
      timer = `<span class="timer-text ready" data-timer="${escapeHtml(acc)}|${SHARED}">可做</span>`;
    } else {
      timer = `<span class="timer-text" data-timer="${escapeHtml(acc)}|${SHARED}">${formatCountdown(st.remaining)}</span>`;
    }
    return `<div class="shared-cell">
      <div class="${cls}" data-acc="${escapeHtml(acc)}" data-pf="${SHARED}" data-type="shared" title="${disabled ? '该账号电力不可用' : (checked ? '点击取消勾选' : '点击标记为已完成')}">${checked ? '✓' : ''}</div>
      ${timer}
    </div>`;
  }

  function renderPower() {
    const box = document.getElementById('powerTableBox');
    let rows = '';
    if (ACCOUNTS.length === 0) {
      rows = `<tr class="empty-row"><td colspan="7">当前无账号，请在顶部「统一账号」输入框中添加</td></tr>`;
    } else {
      rows = ACCOUNTS.map(a => {
        const rec = records[a] || {};
        const disabled = !!rec.disabled;
        const remark = rec.remark || '';
        return `<tr data-acc="${escapeHtml(a)}" class="${disabled ? 'row-disabled' : ''}">
          <td class="account-cell" title="${escapeHtml(a)}"><span class="account-text">${escapeHtml(a)}</span></td>
          <td>${dailyCheckHtml(a, '安卓', !!rec['安卓'], disabled)}</td>
          <td>${dailyCheckHtml(a, '苹果', !!rec['苹果'], disabled)}</td>
          <td>${sharedHtml(a, rec[SHARED] || { done: false, ts: 0 }, disabled)}</td>
          <td><input class="remark-input" type="text" placeholder="备注" data-acc="${escapeHtml(a)}" value="${escapeHtml(remark)}"></td>
          <td><div class="disable-check ${disabled ? 'checked' : ''}" data-acc="${escapeHtml(a)}" title="${disabled ? '取消无法使用' : '标记为无法使用'}">${disabled ? '✓' : ''}</div></td>
          <td><button class="del-btn" data-acc="${escapeHtml(a)}" title="删除该账号">×</button></td>
        </tr>`;
      }).join('');
    }

    box.innerHTML = `<table>
      <colgroup>
        <col style="width:84px">
        <col style="width:12%">
        <col style="width:12%">
        <col style="width:18%">
        <col style="width:22%">
        <col style="width:12%">
        <col style="width:34px">
      </colgroup>
      <thead><tr>
        <th style="text-align:left;padding-left:6px;">账号</th>
        <th>安卓</th>
        <th>苹果</th>
        <th>盲盒</th>
        <th>备注</th>
        <th>无法使用</th>
        <th>操作</th>
      </tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr>
        <td class="account-cell" style="color:#ea3690;">已完成</td>
        <td><div class="col-total" id="pct-android">0 / 0</div></td>
        <td><div class="col-total" id="pct-ios">0 / 0</div></td>
        <td><div class="col-total" id="pct-shared">0 / 0</div></td>
        <td></td><td></td><td></td>
      </tr></tfoot>
    </table>`;

    box.querySelectorAll('.daily-check:not(.disabled)').forEach(el => {
      el.addEventListener('click', function(){
        toggleDaily(this.dataset.acc, this.dataset.pf);
      });
    });

    box.querySelectorAll('.check-box:not(.disabled)').forEach(el => {
      el.addEventListener('click', function(){
        toggleShared(this.dataset.acc);
      });
    });

    box.querySelectorAll('input.remark-input').forEach(inp => {
      inp.addEventListener('change', function(){
        const acc = this.dataset.acc;
        if (!records[acc]) return;
        records[acc].remark = this.value;
        savePowerRecords();
      });
      inp.addEventListener('blur', function(){
        const acc = this.dataset.acc;
        if (!records[acc]) return;
        records[acc].remark = this.value;
        savePowerRecords();
      });
    });

    box.querySelectorAll('.disable-check').forEach(el => {
      el.addEventListener('click', function(){
        const acc = this.dataset.acc;
        if (!records[acc]) return;
        records[acc].disabled = !records[acc].disabled;
        if (records[acc].disabled) {
          DAILY_PLATFORMS.forEach(p => { records[acc][p] = false; });
          records[acc][SHARED] = { done: false, ts: 0 };
        }
        savePowerRecords();
        renderPower();
      });
    });

    box.querySelectorAll('.del-btn').forEach(btn => {
      btn.addEventListener('click', function(){
        requestDeleteAccount(this.dataset.acc);
      });
    });

    updatePowerStats();
    notifyResize();
  }

  function toggleDaily(acc, pf) {
    const rec = records[acc];
    if (!rec || rec.disabled) return;
    rec[pf] = !rec[pf];
    if (dailyDate !== todayStr()) dailyDate = todayStr();
    savePowerRecords();
    renderPower();
  }

  function toggleShared(acc) {
    const rec = records[acc];
    if (!rec || rec.disabled) return;
    const r = rec[SHARED] || { done: false, ts: 0 };
    if (r.done) rec[SHARED] = { done: false, ts: 0 };
    else rec[SHARED] = { done: true, ts: Date.now() };
    savePowerRecords();
    renderPower();
  }

  function updatePowerStats() {
    const activeAccounts = ACCOUNTS.filter(a => records[a] && !records[a].disabled);

    // 已完成账号：安卓 + 苹果 的勾选总数 / (有效账号数 × 2)
    let dailyDone = 0;
    activeAccounts.forEach(a => {
      const rec = records[a] || {};
      if (rec['安卓']) dailyDone++;
      if (rec['苹果']) dailyDone++;
    });
    const dailyTotal = activeAccounts.length * 2;

    // 下一轮时间：只看盲盒 CD 中未到期的
    let nextTs = 0, hasActive = false;
    activeAccounts.forEach(a => {
      const rec = records[a] || {};
      const r = rec[SHARED];
      if (r && r.done) {
        const st = getSharedStatus(r);
        if (!st.ready) {
          if (!hasActive || st.nextTs < nextTs) { nextTs = st.nextTs; hasActive = true; }
        }
      }
    });

    const da = document.getElementById('powerDoneAccounts');
    if (da) da.textContent = `${dailyDone} / ${dailyTotal}`;

    const nextEl = document.getElementById('powerNextTime');
    if (nextEl) {
      if (hasActive) { nextEl.textContent = formatTime(nextTs); nextEl.style.color = '#f97316'; }
      else { nextEl.textContent = activeAccounts.length > 0 ? '全部可做' : '—'; nextEl.style.color = '#22c55e'; }
    }

    const androidDone = activeAccounts.filter(a => records[a] && records[a]['安卓']).length;
    const iosDone = activeAccounts.filter(a => records[a] && records[a]['苹果']).length;
    const sharedDone = activeAccounts.filter(a => records[a] && records[a][SHARED] && records[a][SHARED].done).length;

    const ea = document.getElementById('pct-android');
    if (ea) ea.textContent = `${androidDone} / ${activeAccounts.length}`;
    const ei = document.getElementById('pct-ios');
    if (ei) ei.textContent = `${iosDone} / ${activeAccounts.length}`;
    const es = document.getElementById('pct-shared');
    if (es) es.textContent = `${sharedDone} / ${activeAccounts.length}`;

    notifyResize();
  }

  function startTimer() {
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      if (checkDailyReset()) {
        renderPower();
        return;
      }
      document.querySelectorAll('[data-timer]').forEach(el => {
        const parts = el.dataset.timer.split('|');
        const acc = parts[0];
        const rec = records[acc];
        if (!rec) return;
        if (rec.disabled) {
          el.textContent = '—';
          el.className = 'timer-text idle';
          return;
        }
        const r = rec[SHARED];
        const st = getSharedStatus(r);
        if (!st.done) {
          el.textContent = IDLE_TEXT;
          el.className = 'timer-text idle';
        } else if (st.ready) {
          el.textContent = '可做';
          el.className = 'timer-text ready';
        } else {
          el.textContent = formatCountdown(st.remaining);
          el.className = 'timer-text';
        }
      });
      updatePowerStats();
    }, 1000);
  }

  function clearPowerData() {
    if (!ACCOUNTS.length) { alert('当前没有账号，无需清空数据'); return; }
    let has = false;
    ACCOUNTS.forEach(a => {
      DAILY_PLATFORMS.forEach(p => { if (records[a] && records[a][p]) has = true; });
      const r = records[a] && records[a][SHARED];
      if (r && (r.done || r.ts)) has = true;
    });
    if (!has) { alert('当前所有电力记录已经是空的'); return; }
    if (!confirm('确定要清空电力模块的所有勾选记录吗？账号列表、备注、无法使用标记会保留。')) return;
    ACCOUNTS.forEach(a => {
      if (!records[a]) records[a] = {};
      DAILY_PLATFORMS.forEach(p => { records[a][p] = false; });
      records[a][SHARED] = { done: false, ts: 0 };
    });
    dailyDate = todayStr();
    savePowerRecords();
    renderPower();
  }

  function resetPowerRound() {
    if (!ACCOUNTS.length) { alert('当前没有账号'); return; }
    if (!confirm('确定要重置所有账号的盲盒电力轮次吗？盲盒勾选和计时会被清除，安卓/苹果每日任务不受影响。')) return;
    ACCOUNTS.forEach(a => {
      if (!records[a]) records[a] = {};
      records[a][SHARED] = { done: false, ts: 0 };
    });
    savePowerRecords();
    renderPower();
  }

  window.addEventListener('message', function(e) {
    if (!e.data || e.data.type !== 'accounts-changed') return;
    const incoming = Array.isArray(e.data.accounts) ? e.data.accounts : [];
    ACCOUNTS = incoming.filter(x => typeof x === 'string' && x.trim() !== '').map(normalizeName);
    const loaded = loadPowerState();
    records = loaded.records;
    dailyDate = loaded.dailyDate;
    syncRecordsWithAccounts();
    if (checkDailyReset()) {
      savePowerRecords();
    }
    renderPower();
  });

  function init() {
    const loaded = loadPowerState();
    records = loaded.records;
    dailyDate = loaded.dailyDate;

    syncRecordsWithAccounts();
    if (checkDailyReset()) {
      savePowerRecords();
    }

    renderPower();

    document.getElementById('powerClearDataBtn').addEventListener('click', clearPowerData);
    document.getElementById('powerResetRoundBtn').addEventListener('click', resetPowerRound);

    startTimer();

    document.addEventListener('visibilitychange', function() {
      if (!document.hidden) {
        if (checkDailyReset()) {
          renderPower();
        }
      }
    });
  }
  init();
})();
</script>
</body>
</html>
