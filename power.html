<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>电力</title>
<link rel="stylesheet" href="common.css">
<style>
  /* 电力模块独有样式 */
  .check-cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    min-height: 38px;
  }
  .check-box {
    width: 22px;
    height: 22px;
    border-radius: 6px;
    border: 2px solid #f0d6e4;
    background: white;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: 0.15s;
    font-size: 14px;
    color: transparent;
    font-weight: bold;
    user-select: none;
    flex-shrink: 0;
  }
  .check-box:hover { border-color: #ea3690; }
  .check-box.checked { background: #ea3690; border-color: #ea3690; color: #fff; }

  /* 无法使用状态下的勾选框 */
  .check-box.disabled {
    background: #f3f3f3;
    border-color: #e0e0e0;
    cursor: not-allowed;
    pointer-events: none;
    color: transparent;
  }
  .check-box.checked.disabled {
    background: #d9d9d9;
    border-color: #d0d0d0;
    color: #fff;
  }

  .timer-text {
    display: block;
    font-size: 9px;
    font-weight: bold;
    white-space: nowrap;
    line-height: 12px;
    height: 12px;
    min-height: 12px;
    color: #f97316;
    font-variant-numeric: tabular-nums;
  }
  .timer-text.idle { color: #c7c7c7; }
  .timer-text.ready { color: #22c55e; }

  /* 备注输入 */
  input.remark-input {
    width: 100%;
    max-width: 120px;
    height: 26px;
    padding: 0 6px;
    text-align: left;
    background: white;
    border: 1px solid #f0d6e4;
    border-radius: 6px;
    color: #555;
    font-size: 11px;
    font-family: inherit;
    outline: none;
    transition: 0.15s;
  }
  input.remark-input:focus {
    border-color: #ea3690;
    box-shadow: 0 0 0 2px rgba(234,54,144,0.12);
  }
  input.remark-input::placeholder { color: #ccc; }

  /* 无法使用勾选框（小方块） */
  .disable-check {
    width: 20px;
    height: 20px;
    border-radius: 5px;
    border: 2px solid #f0d6e4;
    background: white;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: 0.15s;
    font-size: 12px;
    color: transparent;
    font-weight: bold;
    user-select: none;
  }
  .disable-check:hover { border-color: #f97316; }
  .disable-check.checked { background: #f97316; border-color: #f97316; color: #fff; }

  /* 删除按钮 */
  .del-btn {
    width: 24px; height: 24px; border-radius: 50%;
    border: 1px solid rgba(231,76,60,0.35);
    background: white; color: #e74c3c; font-size: 14px; line-height: 1;
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
    transition: 0.15s; font-family: inherit; padding: 0;
  }
  .del-btn:hover { background: rgba(231,76,60,0.1); border-color: #e74c3c; }

  /* 无法使用的账号行：整行淡化 */
  tr.row-disabled .account-text {
    color: #bbb;
    text-decoration: line-through;
  }
  tr.row-disabled .remark-input {
    background: #fafafa;
    color: #bbb;
  }
</style>
</head>
<body>
  <div class="stats-row">
    <div class="stat-card"><div class="s-label">当前轮次</div><div class="s-value" id="powerRound">0</div></div>
    <div class="stat-card done"><div class="s-label">已完成账号</div><div class="s-value" id="powerDoneAccounts">0 / 0</div></div>
    <div class="stat-card done"><div class="s-label">下一轮时间</div><div class="s-value" id="powerNextTime" style="font-size:13px;">—</div></div>
  </div>

  <div class="toolbar">
    <button id="powerClearDataBtn" class="danger">清空数据</button>
    <button id="powerResetRoundBtn">重置轮次</button>
  </div>

  <div class="table-box" id="powerTableBox"></div>

<script>
(function(){
  const POWER_PLATFORMS = ['安卓', '苹果'];
  const POWER_INTERVAL_MS = 4 * 60 * 60 * 1000;
  const POWER_STORAGE_KEY = 'bang_power_state';

  let ACCOUNTS = [];
  let records = {};   // { 账号: { 安卓:{done,ts}, 苹果:{done,ts}, disabled:false, remark:'' } }
  let timerInterval = null;

  // ===== 工具 =====
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function normalizeName(name) { return String(name).trim().replace(/\s+/g, ' '); }
  function pad2(n) { return String(n).padStart(2, '0'); }
  function formatTime(ts) {
    const d = new Date(ts);
    return `${pad2(d.getMonth()+1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;
  }
  function formatCountdown(ms) {
    if (ms <= 0) return '可做';
    const totalSec = Math.floor(ms / 1000);
    const h = Math.floor(totalSec / 3600);
    const m = Math.floor((totalSec % 3600) / 60);
    const s = totalSec % 60;
    return `${pad2(h)}:${pad2(m)}:${pad2(s)}`;
  }
  const IDLE_TEXT = '00:00:00';

  function getNextAvailableTs(ts) {
    if (!ts || ts <= 0) return 0;
    const after4h = ts + POWER_INTERVAL_MS;
    const d = new Date(ts);
    const nextMidnight = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1, 0, 0, 0, 0).getTime();
    return Math.min(after4h, nextMidnight);
  }
  function getRecordStatus(r) {
    if (!r || !r.done) return { done: false, ready: true, remaining: 0, nextTs: 0 };
    const nextTs = getNextAvailableTs(r.ts);
    const remaining = nextTs - Date.now();
    return { done: true, ready: remaining <= 0, remaining: Math.max(0, remaining), nextTs };
  }

  function notifyResize() {
    if (window.parent && window.parent !== window) {
      try {
        window.parent.postMessage({
          type: 'resize',
          module: 'power',
          height: document.body.scrollHeight
        }, '*');
      } catch(e) {}
    }
  }

  function requestDeleteAccount(name) {
    if (window.parent && window.parent !== window) {
      try {
        window.parent.postMessage({ type: 'delete-account', account: name }, '*');
      } catch(e) {}
    }
  }

  // ===== 存储 =====
  function loadPowerRecords() {
    try {
      const raw = localStorage.getItem(POWER_STORAGE_KEY);
      if (raw) {
        const obj = JSON.parse(raw);
        if (obj && typeof obj === 'object' && obj.records && typeof obj.records === 'object') {
          return obj.records;
        }
      }
    } catch(e) {}
    return {};
  }
  function savePowerRecords() {
    localStorage.setItem(POWER_STORAGE_KEY, JSON.stringify({ records }));
  }

  function syncRecordsWithAccounts() {
    const normalized = {};
    Object.keys(records).forEach(k => {
      const nk = normalizeName(k);
      if (!normalized[nk]) normalized[nk] = records[k];
    });
    records = normalized;
    ACCOUNTS.forEach(a => {
      if (!records[a]) records[a] = {};
      POWER_PLATFORMS.forEach(p => {
        if (!records[a][p]) records[a][p] = { done: false, ts: 0 };
      });
      if (typeof records[a].disabled !== 'boolean') records[a].disabled = false;
      if (typeof records[a].remark !== 'string') records[a].remark = '';
    });
    Object.keys(records).forEach(a => { if (!ACCOUNTS.includes(a)) delete records[a]; });
    ACCOUNTS = [...new Set(ACCOUNTS)];
  }

  function timerHtml(acc, pf, r, disabled) {
    const safeAcc = escapeHtml(acc);
    const safePf = escapeHtml(pf);
    if (disabled) {
      return `<span class="timer-text idle" data-timer="${safeAcc}|${safePf}">—</span>`;
    }
    const st = getRecordStatus(r);
    if (!st.done) {
      return `<span class="timer-text idle" data-timer="${safeAcc}|${safePf}">${IDLE_TEXT}</span>`;
    }
    if (st.ready) {
      return `<span class="timer-text ready" data-timer="${safeAcc}|${safePf}">可做</span>`;
    }
    return `<span class="timer-text" data-timer="${safeAcc}|${safePf}">${formatCountdown(st.remaining)}</span>`;
  }

  // ===== 渲染 =====
  function renderPower() {
    const box = document.getElementById('powerTableBox');
    let rows = '';
    if (ACCOUNTS.length === 0) {
      rows = `<tr class="empty-row"><td colspan="${POWER_PLATFORMS.length + 4}">当前无账号，请在顶部「统一账号」输入框中添加</td></tr>`;
    } else {
      rows = ACCOUNTS.map((a) => {
        const rec = records[a] || {};
        const disabled = !!rec.disabled;
        const remark = rec.remark || '';
        return `<tr data-acc="${escapeHtml(a)}" class="${disabled ? 'row-disabled' : ''}">
          <td class="account-cell" title="${escapeHtml(a)}"><span class="account-text">${escapeHtml(a)}</span></td>
          ${POWER_PLATFORMS.map(p => {
            const r = rec[p] || { done: false, ts: 0 };
            const checkedCls = r.done ? 'checked' : '';
            const disabledCls = disabled ? 'disabled' : '';
            return `<td><div class="check-cell">
              <div class="check-box ${checkedCls} ${disabledCls}" data-acc="${escapeHtml(a)}" data-pf="${escapeHtml(p)}" title="${disabled ? '该账号电力不可用' : (r.done ? '点击取消勾选' : '点击标记为已完成')}">${r.done ? '✓' : ''}</div>
              ${timerHtml(a, p, r, disabled)}
            </div></td>`;
          }).join('')}
          <td><input class="remark-input" type="text" placeholder="备注" data-acc="${escapeHtml(a)}" value="${escapeHtml(remark)}"></td>
          <td><div class="disable-check ${disabled ? 'checked' : ''}" data-acc="${escapeHtml(a)}" title="${disabled ? '取消无法使用' : '标记为无法使用'}">${disabled ? '✓' : ''}</div></td>
          <td><button class="del-btn" data-acc="${escapeHtml(a)}" title="删除该账号">×</button></td>
        </tr>`;
      }).join('');
    }

    box.innerHTML = `<table>
      <colgroup>
        <col style="width:84px">
        <col style="width:15%">
        <col style="width:15%">
        <col style="width:22%">
        <col style="width:12%">
        <col style="width:34px">
      </colgroup>
      <thead><tr>
        <th style="text-align:left;padding-left:6px;">账号</th>
        ${POWER_PLATFORMS.map(p => `<th>${p}</th>`).join('')}
        <th>备注</th>
        <th>无法使用</th>
        <th>操作</th>
      </tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr>
        <td class="account-cell" style="color:#ea3690;">已完成</td>
        ${POWER_PLATFORMS.map((_, i) => `<td><div class="col-total" id="pct-${i}">0 / 0</div></td>`).join('')}
        <td></td><td></td><td></td>
      </tr></tfoot>
    </table>`;

    // 勾选框点击（disabled 状态下 .check-box 有 pointer-events:none，不会触发）
    box.querySelectorAll('.check-box:not(.disabled)').forEach(el => {
      el.addEventListener('click', function(){ togglePowerCheck(this.dataset.acc, this.dataset.pf); });
    });

    // 备注输入
    box.querySelectorAll('input.remark-input').forEach(inp => {
      inp.addEventListener('change', function(){
        const acc = this.dataset.acc;
        if (!records[acc]) return;
        records[acc].remark = this.value;
        savePowerRecords();
      });
      inp.addEventListener('blur', function(){
        const acc = this.dataset.acc;
        if (!records[acc]) return;
        records[acc].remark = this.value;
        savePowerRecords();
      });
    });

    // 无法使用勾选框
    box.querySelectorAll('.disable-check').forEach(el => {
      el.addEventListener('click', function(){
        const acc = this.dataset.acc;
        if (!records[acc]) return;
        records[acc].disabled = !records[acc].disabled;
        // 标记为无法使用时，清掉两个平台的勾选
        if (records[acc].disabled) {
          POWER_PLATFORMS.forEach(p => { records[acc][p] = { done: false, ts: 0 }; });
        }
        savePowerRecords();
        renderPower();
      });
    });

    // 删除按钮
    box.querySelectorAll('.del-btn').forEach(btn => {
      btn.addEventListener('click', function(){
        requestDeleteAccount(this.dataset.acc);
      });
    });

    updatePowerStats();
    notifyResize();
  }

  function togglePowerCheck(acc, pf) {
    const rec = records[acc];
    if (!rec || rec.disabled) return;
    const r = rec[pf] || { done: false, ts: 0 };
    if (r.done) rec[pf] = { done: false, ts: 0 };
    else rec[pf] = { done: true, ts: Date.now() };
    savePowerRecords();
    renderPower();
  }

  // ===== 统计（排除 disabled 账号） =====
  function updatePowerStats() {
    const activeAccounts = ACCOUNTS.filter(a => records[a] && !records[a].disabled);

    let doneAcc = 0;
    activeAccounts.forEach(a => {
      const rec = records[a] || {};
      if (POWER_PLATFORMS.every(p => rec[p] && rec[p].done)) doneAcc++;
    });

    let nextTs = 0, hasActive = false;
    activeAccounts.forEach(a => {
      const rec = records[a] || {};
      POWER_PLATFORMS.forEach(p => {
        const r = rec[p];
        if (r && r.done) {
          const st = getRecordStatus(r);
          if (!st.ready) {
            if (!hasActive || st.nextTs < nextTs) { nextTs = st.nextTs; hasActive = true; }
          }
        }
      });
    });

    const roundEl = document.getElementById('powerRound');
    if (roundEl) {
      const total = activeAccounts.length * POWER_PLATFORMS.length;
      let done = 0;
      activeAccounts.forEach(a => {
        const rec = records[a] || {};
        POWER_PLATFORMS.forEach(p => { if (rec[p] && rec[p].done) done++; });
      });
      roundEl.textContent = `${done} / ${total}`;
    }

    const da = document.getElementById('powerDoneAccounts');
    if (da) da.textContent = `${doneAcc} / ${activeAccounts.length}`;

    const nextEl = document.getElementById('powerNextTime');
    if (nextEl) {
      if (hasActive) { nextEl.textContent = formatTime(nextTs); nextEl.style.color = '#f97316'; }
      else { nextEl.textContent = activeAccounts.length > 0 ? '全部可做' : '—'; nextEl.style.color = '#22c55e'; }
    }

    POWER_PLATFORMS.forEach((pf, i) => {
      const el = document.getElementById(`pct-${i}`);
      if (el) {
        let done = 0;
        activeAccounts.forEach(a => { const rec = records[a] || {}; if (rec[pf] && rec[pf].done) done++; });
        el.textContent = `${done} / ${activeAccounts.length}`;
      }
    });

    notifyResize();
  }

  // ===== 倒计时 =====
  function startTimer() {
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      document.querySelectorAll('[data-timer]').forEach(el => {
        const [acc, pf] = el.dataset.timer.split('|');
        const rec = records[acc];
        if (!rec) return;
        if (rec.disabled) {
          el.textContent = '—';
          el.className = 'timer-text idle';
          return;
        }
        const r = rec[pf];
        const st = getRecordStatus(r);
        if (!st.done) {
          el.textContent = IDLE_TEXT;
          el.className = 'timer-text idle';
        } else if (st.ready) {
          el.textContent = '可做';
          el.className = 'timer-text ready';
        } else {
          el.textContent = formatCountdown(st.remaining);
          el.className = 'timer-text';
        }
      });
      updatePowerStats();
    }, 1000);
  }

  // ===== 清空 / 重置 =====
  function clearPowerData() {
    if (!ACCOUNTS.length) { alert('当前没有账号，无需清空数据'); return; }
    let has = false;
    ACCOUNTS.forEach(a => POWER_PLATFORMS.forEach(p => { const r = records[a] && records[a][p]; if (r && (r.done || r.ts)) has = true; }));
    if (!has) { alert('当前所有电力记录已经是空的'); return; }
    if (!confirm('确定要清空电力模块的所有勾选记录吗？账号列表、备注、无法使用标记会保留。')) return;
    ACCOUNTS.forEach(a => {
      if (!records[a]) records[a] = {};
      POWER_PLATFORMS.forEach(p => records[a][p] = { done: false, ts: 0 });
    });
    savePowerRecords();
    renderPower();
  }
  function resetPowerRound() {
    if (!ACCOUNTS.length) { alert('当前没有账号'); return; }
    if (!confirm('确定要重置所有账号的电力轮次吗？所有勾选记录将被清除，下一次可立即开始。')) return;
    ACCOUNTS.forEach(a => {
      if (!records[a]) records[a] = {};
      POWER_PLATFORMS.forEach(p => records[a][p] = { done: false, ts: 0 });
    });
    savePowerRecords();
    renderPower();
  }

  // ===== 接收统一账号 =====
  window.addEventListener('message', function(e) {
    if (!e.data || e.data.type !== 'accounts-changed') return;
    const incoming = Array.isArray(e.data.accounts) ? e.data.accounts : [];
    ACCOUNTS = incoming.filter(x => typeof x === 'string' && x.trim() !== '').map(normalizeName);
    records = loadPowerRecords();
    syncRecordsWithAccounts();
    savePowerRecords();
    renderPower();
  });

  // ===== 初始化 =====
  function init() {
    records = loadPowerRecords();
    renderPower();

    document.getElementById('powerClearDataBtn').addEventListener('click', clearPowerData);
    document.getElementById('powerResetRoundBtn').addEventListener('click', resetPowerRound);

    startTimer();
  }
  init();
})();
</script>
</body>
</html>
