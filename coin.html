<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>金币</title>
<link rel="stylesheet" href="common.css">
<style>
  .stats-row.single {
    grid-template-columns: 1fr;
  }

  .coin-cell {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    min-height: 38px;
  }
  .coin-cell input.coin-input {
    width: 100%;
    max-width: 120px;
    height: 30px;
    padding: 0 6px;
    text-align: center;
    line-height: 28px;
    background: white;
    border: 1px solid #f0d6e4;
    border-radius: 6px;
    color: #333;
    font-size: 12px;
    font-weight: bold;
    outline: none;
    transition: 0.15s;
    font-family: inherit;
    -moz-appearance: textfield;
    appearance: textfield;
  }
  .coin-cell input.coin-input::-webkit-outer-spin-button,
  .coin-cell input.coin-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .coin-cell input.coin-input:focus {
    border-color: #ea3690;
    box-shadow: 0 0 0 2px rgba(234,54,144,0.12);
  }
  .coin-cell input.coin-input::placeholder { color: #ccc; font-weight: normal; }

  .coin-unit {
    font-size: 11px;
    color: #999;
    font-weight: bold;
    flex-shrink: 0;
  }

  .del-btn {
    width: 24px; height: 24px; border-radius: 50%;
    border: 1px solid rgba(231,76,60,0.35);
    background: white; color: #e74c3c; font-size: 14px; line-height: 1;
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
    transition: 0.15s; font-family: inherit; padding: 0;
  }
  .del-btn:hover { background: rgba(231,76,60,0.1); border-color: #e74c3c; }
</style>
</head>
<body>
  <div class="stats-row single">
    <div class="stat-card"><div class="s-label">总金币</div><div class="s-value" id="totalCoin">0w</div></div>
  </div>

  <div class="toolbar">
    <button id="clearDataBtn" class="danger">清空数据</button>
  </div>

  <div class="table-box" id="tableBox"></div>

<script>
(function(){
  const DATA_STORAGE_KEY = 'bang_coin_scores';

  let ACCOUNTS = [];
  let data = {};

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function normalizeName(name) { return String(name).trim().replace(/\s+/g, ' '); }

  function notifyResize() {
    if (window.parent && window.parent !== window) {
      try {
        window.parent.postMessage({
          type: 'resize',
          module: 'coin',
          height: document.body.scrollHeight
        }, '*');
      } catch(e) {}
    }
  }

  function requestDeleteAccount(name) {
    if (window.parent && window.parent !== window) {
      try {
        window.parent.postMessage({ type: 'delete-account', account: name }, '*');
      } catch(e) {}
    }
  }

  function loadData() {
    try {
      const raw = localStorage.getItem(DATA_STORAGE_KEY);
      if (raw) {
        const obj = JSON.parse(raw);
        if (obj && typeof obj === 'object') return obj;
      }
    } catch(e) {}
    return {};
  }
  function saveData() {
    localStorage.setItem(DATA_STORAGE_KEY, JSON.stringify(data));
  }

  function syncDataWithAccounts() {
    const normalized = {};
    Object.keys(data).forEach(k => {
      const nk = normalizeName(k);
      if (!normalized[nk]) normalized[nk] = data[k];
    });
    data = normalized;

    ACCOUNTS.forEach(a => {
      if (data[a] === undefined) data[a] = '';
    });
    Object.keys(data).forEach(a => { if (!ACCOUNTS.includes(a)) delete data[a]; });
    ACCOUNTS = [...new Set(ACCOUNTS)];
  }

  function renderAll() {
    const box = document.getElementById('tableBox');
    let rows = '';
    if (ACCOUNTS.length === 0) {
      rows = `<tr class="empty-row"><td colspan="3">当前无账号，请在顶部「统一账号」输入框中添加</td></tr>`;
    } else {
      rows = ACCOUNTS.map(a => {
        const val = (data[a] !== undefined) ? data[a] : '';
        return `<tr data-acc="${escapeHtml(a)}">
          <td class="account-cell" title="${escapeHtml(a)}"><span class="account-text">${escapeHtml(a)}</span></td>
          <td>
            <div class="coin-cell">
              <input class="coin-input" type="number" min="0" step="1" placeholder="—" data-acc="${escapeHtml(a)}" value="${escapeHtml(val)}">
              <span class="coin-unit">w</span>
            </div>
          </td>
          <td><button class="del-btn" data-acc="${escapeHtml(a)}" title="删除该账号">×</button></td>
        </tr>`;
      }).join('');
    }

    box.innerHTML = `<table>
      <colgroup>
        <col style="width:100px">
        <col style="width:auto">
        <col style="width:40px">
      </colgroup>
      <thead><tr>
        <th style="text-align:left;padding-left:6px;">账号</th>
        <th>金币</th>
        <th>操作</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;

    box.querySelectorAll('input.coin-input').forEach(inp => {
      inp.addEventListener('input', function(){
        const a = this.dataset.acc;
        data[a] = this.value;
        saveData();
        updateStats();
        notifyResize();
      });
    });

    box.querySelectorAll('.del-btn').forEach(btn => {
      btn.addEventListener('click', function(){
        requestDeleteAccount(this.dataset.acc);
      });
    });

    updateStats();
    notifyResize();
  }

  function updateStats() {
    let total = 0;
    ACCOUNTS.forEach(a => {
      const raw = (data[a] !== undefined) ? data[a] : '';
      const n = parseInt(raw, 10);
      if (!isNaN(n)) total += n;
    });

    const totalEl = document.getElementById('totalCoin');
    if (totalEl) totalEl.textContent = `${total.toLocaleString()}w`;

    notifyResize();
  }

  function clearData() {
    if (!ACCOUNTS.length) { alert('当前没有账号，无需清空数据'); return; }
    let has = false;
    ACCOUNTS.forEach(a => {
      if (data[a] !== undefined && String(data[a]).trim() !== '') has = true;
    });
    if (!has) { alert('当前所有金币数据已经是空的'); return; }
    if (!confirm('确定要清空所有账号的金币数据吗？账号列表将保留。')) return;
    ACCOUNTS.forEach(a => { data[a] = ''; });
    saveData();
    renderAll();
  }

  window.addEventListener('message', function(e) {
    if (!e.data || e.data.type !== 'accounts-changed') return;
    const incoming = Array.isArray(e.data.accounts) ? e.data.accounts : [];
    ACCOUNTS = incoming.filter(x => typeof x === 'string' && x.trim() !== '').map(normalizeName);
    data = loadData();
    syncDataWithAccounts();
    saveData();
    renderAll();
  });

  function init() {
    data = loadData();
    renderAll();

    document.getElementById('clearDataBtn').addEventListener('click', clearData);
  }
  init();
})();
</script>
</body>
</html>
