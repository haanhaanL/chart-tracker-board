<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>穆祉丞051</title>
<link rel="stylesheet" href="common.css">
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { display: block; background: #faf7f9; min-height: 100vh; padding: 6px; overflow: auto; }
  body::after {
    content: ""; position: fixed; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 99998;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='120'><text x='20' y='70' font-size='28' font-weight='900' fill='rgba(234,54,144,0.06)' transform='rotate(-25 100 60)'>mzc051</text></svg>");
    background-repeat: repeat; background-size: 200px 120px;
  }
  .header-area { max-width: 1600px; margin: 0 auto 6px; text-align: center; padding: 0 4px; }
  .header-area h1 { color: #ea3690; font-size: 18px; margin: 22px 0 10px; }
  .header-area .subtitle { color: #999; font-size: 12px; margin-bottom: 6px; }
  .auth-row { max-width: 1600px; margin: 0 auto 12px; display: flex; justify-content: flex-end; align-items: center; gap: 10px; padding: 0 4px; }
  .auth-text-btn { background: transparent; border: none; color: #ea3690; font-size: 13px; font-weight: bold; cursor: pointer; padding: 2px 0; font-family: inherit; transition: 0.15s; white-space: nowrap; }
  .auth-text-btn:hover { text-decoration: underline; }
  .auth-text-btn.danger { color: #e74c3c; }
  .auth-user { font-size: 12px; color: #555; font-weight: bold; white-space: nowrap; }
  .auth-user b { color: #ea3690; }
  .global-toolbar, .backup-toolbar {
    max-width: 1600px; margin: 0 auto 14px; background: #fff; border-radius: 10px;
    box-shadow: 0 3px 10px rgba(234,54,144,0.07); border: 1px solid rgba(234,54,144,0.10);
    padding: 10px 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
  }
  .global-toolbar .label, .backup-toolbar .label { font-size: 12px; font-weight: bold; color: #ea3690; white-space: nowrap; margin-right: 2px; }
  .global-toolbar input.new-account {
    flex: 1 1 260px; min-width: 200px; height: 32px; padding: 0 10px;
    border: 1px dashed #f0d6e4; border-radius: 8px; background: #fdf7fa; color: #555;
    font-size: 12px; font-family: inherit; outline: none; transition: 0.15s;
  }
  .global-toolbar input.new-account:focus { border-color: #ea3690; border-style: solid; background: #fff; box-shadow: 0 0 0 2px rgba(234,54,144,0.12); }
  .global-toolbar input.new-account::placeholder { color: #bbb; }
  .global-toolbar button, .backup-toolbar button {
    height: 32px; padding: 0 14px; border-radius: 16px; border: 1px solid rgba(234,54,144,0.35);
    background: white; color: #ea3690; font-size: 12px; font-weight: bold; cursor: pointer;
    transition: all 0.2s ease; outline: none; font-family: inherit; white-space: nowrap;
  }
  .global-toolbar button:hover, .backup-toolbar button:hover { background: rgba(234,54,144,0.06); }
  .global-toolbar button.danger, .backup-toolbar button.danger { border-color: rgba(231,76,60,0.4); color: #e74c3c; }
  .global-toolbar button.danger:hover, .backup-toolbar button.danger:hover { background: rgba(231,76,60,0.06); }
  .global-toolbar .count { font-size: 11px; color: #999; white-space: nowrap; margin-left: auto; }
  .global-toolbar .count b { color: #ea3690; }
  .backup-toolbar button:disabled { opacity: 0.45; cursor: not-allowed; border-color: #e0e0e0; color: #aaa; }
  .backup-toolbar .hint { font-size: 11px; color: #999; white-space: nowrap; margin-left: auto; }
  .module-tabs {
    display: none; max-width: 1600px; margin: 0 auto 10px; gap: 0; flex-wrap: nowrap; overflow: hidden;
    background: #fff; border: 1px solid rgba(234,54,144,0.35); border-radius: 18px; padding: 3px;
    box-shadow: 0 2px 8px rgba(234,54,144,0.06);
  }
  .module-tab-btn {
    flex: 1; min-width: 0; padding: 7px 6px; border-radius: 15px; border: none; background: transparent;
    color: #ea3690; font-size: 12px; font-weight: bold; cursor: pointer; transition: all 0.2s ease;
    outline: none; font-family: inherit; white-space: nowrap;
  }
  .module-tab-btn.active { background: #ea3690; color: #fff; box-shadow: 0 2px 6px rgba(234,54,144,0.25); }
  .module-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: 100%;
    max-width: 1600px; margin: 0 auto 40px; align-items: stretch;
  }
  .module-card {
    background: white; border-radius: 10px; box-shadow: 0 3px 10px rgba(234,54,144,0.07);
    border: 1px solid rgba(234,54,144,0.10); overflow: hidden; display: flex;
    flex-direction: column; min-width: 0;
  }
  .module-card .module-title { background: #ea3690; color: #fff; font-size: 13px; font-weight: bold; padding: 7px 14px; text-align: center; flex-shrink: 0; }
  .module-card iframe { width: 100%; border: 0; display: block; background: #fff; height: 420px; min-height: 120px; }
  @media (max-width: 900px) {
    .header-area h1 { font-size: 16px; margin: 16px 0 8px; }
    .auth-row { justify-content: flex-end; }
    .module-tabs { display: flex; }
    .module-grid { display: block; margin-bottom: 30px; }
    .module-card { display: none; margin-bottom: 0; }
    .module-card.active { display: flex; }
    .module-card.force-show { display: flex !important; margin-bottom: 8px; }
    .global-toolbar input.new-account { flex-basis: 100%; }
    .global-toolbar .count { margin-left: 0; width: 100%; text-align: right; }
    .backup-toolbar .hint { margin-left: 0; width: 100%; text-align: right; }
  }
  #importJsonInput { display: none; }
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.35); display: flex;
    align-items: center; justify-content: center; z-index: 99999; padding: 16px;
    animation: fadeIn 0.15s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal-box {
    background: #fff; border-radius: 12px; box-shadow: 0 10px 40px rgba(234,54,144,0.2);
    border: 1px solid rgba(234,54,144,0.15); max-width: 380px; width: 100%;
    overflow: hidden; animation: popIn 0.18s ease;
  }
  @keyframes popIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .modal-title { background: transparent; color: #ea3690; font-size: 15px; font-weight: bold; padding: 16px 16px 0 16px; text-align: center; }
  .modal-body { padding: 12px 16px 16px 16px; display: flex; flex-direction: column; gap: 12px; }
  .modal-message { font-size: 12px; color: #666; line-height: 1.6; text-align: center; }
  .modal-message b { color: #ea3690; font-weight: bold; }
  .modal-message .hint { font-size: 11px; color: #999; }
  .modal-field { display: flex; flex-direction: column; gap: 4px; }
  .modal-field label { font-size: 11px; color: #999; font-weight: bold; padding-left: 4px; }
  .modal-input {
    width: 100%; height: 38px; padding: 0 12px; border: 1px solid #f0d6e4; border-radius: 8px;
    background: #FFFFFF; color: #333; font-size: 15px; font-family: inherit; outline: none; transition: 0.15s;
  }
  .modal-input:focus { border-color: #ea3690; background: #fff; box-shadow: 0 0 0 2px rgba(234,54,144,0.12); }
  .modal-input::placeholder { color: #ccc; font-weight: normal; }
  .modal-actions { display: flex; gap: 8px; }
  .modal-actions button {
    flex: 1; height: 38px; border-radius: 19px; font-size: 13px; font-weight: bold;
    cursor: pointer; font-family: inherit; transition: all 0.2s ease; outline: none;
  }
  .modal-btn-cancel { border: 1px solid rgba(234,54,144,0.35); background: #fff; color: #ea3690; }
  .modal-btn-cancel:hover { background: rgba(234,54,144,0.06); }
  .modal-btn-ok { border: 1px solid #ea3690; background: #ea3690; color: #fff; box-shadow: 0 3px 10px rgba(234,54,144,0.25); }
  .modal-btn-ok:hover { background: #d42f80; border-color: #d42f80; }
  .modal-btn-secondary { border: 1px solid rgba(234,54,144,0.35); background: #fff; color: #ea3690; }
  .modal-btn-secondary:hover { background: rgba(234,54,144,0.06); }
</style>
</head>
<body>

  <div class="header-area">
    <h1 id="exportTitle">穆祉丞051</h1>
    <div class="subtitle" id="exportSubtitle">专注EP</div>
  </div>

  <div class="auth-row" id="authBar">
    <button id="authOpenBtn" class="auth-text-btn">登录 / 注册</button>
    <span class="auth-user" id="authUser" style="display:none;"></span>
    <button id="authLogoutBtn" class="auth-text-btn danger" style="display:none;">退出登录</button>
  </div>

  <div class="global-toolbar">
    <span class="label">打榜账号</span>
    <input class="new-account" type="text" id="globalNewAccount"
           placeholder="输入账号名，逗号或空格分隔可一次新增多个，按回车确认">
    <button id="globalAddBtn">新增</button>
    <button id="globalClearAccountsBtn" class="danger">清空账号</button>
    <button id="exportPngBtn">导出 PNG</button>
    <span class="count">当前账号：<b id="globalAccountCount">0</b> 个</span>
  </div>

  <div class="backup-toolbar">
    <span class="label">数据备份</span>
    <button id="exportAllBtn">导出数据</button>
    <button id="importAllBtn">导入数据</button>
    <input type="file" id="importJsonInput" accept=".json,application/json">
    <button id="cloudSaveBtn" disabled>云端保存</button>
    <button id="cloudLoadBtn" disabled>云端读取</button>
    <span class="hint" id="cloudStatus">请先登录</span>
  </div>

  <div class="module-tabs" id="moduleTabs">
    <button class="module-tab-btn active" data-module="power">电力</button>
    <button class="module-tab-btn" data-module="youni">由你积分</button>
    <button class="module-tab-btn" data-module="coin">金币</button>
    <button class="module-tab-btn" data-module="play">刷播</button>
  </div>

  <div class="module-grid" id="moduleGrid">
    <div class="module-card active" data-module="power">
      <div class="module-title">电力（盲盒CD：4h）</div>
      <iframe src="power.html" title="电力"></iframe>
    </div>
    <div class="module-card" data-module="youni">
      <div class="module-title">由你积分（>112）</div>
      <iframe src="youni.html" title="由你积分"></iframe>
    </div>
    <div class="module-card" data-module="coin">
      <div class="module-title">金币（>48w）</div>
      <iframe src="coin.html" title="金币"></iframe>
    </div>
    <div class="module-card" data-module="play">
      <div class="module-title">刷播</div>
      <iframe src="play.html" title="刷播"></iframe>
    </div>
  </div>

  <script>
    // ===== Supabase 配置 =====
    const SUPABASE_URL = 'https://vymukyyihiykkdmmqvyi.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_KpaSfKbb-HTb3z8ouXt8AA_9oeeRmps';
    let supabaseClient = null;
    let currentUser = null;
    let cloudReady = false;

    const LOCAL_CHANGE_KEY = 'bang_last_local_change';
    let cloudLastUpdatedAt = null;
    let syncInProgress = false;

    function getLocalChangeTs() {
      return parseInt(localStorage.getItem(LOCAL_CHANGE_KEY) || '0', 10);
    }
    function setLocalChangeNow(ts) {
      const v = (typeof ts === 'number' && ts > 0) ? ts : Date.now();
      localStorage.setItem(LOCAL_CHANGE_KEY, String(v));
    }
    function formatTs(isoOrMs) {
      if (!isoOrMs) return '—';
      const d = new Date(isoOrMs);
      if (isNaN(d.getTime())) return '—';
      const p = n => String(n).padStart(2, '0');
      return `${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
    }
    function setCloudStatus(text, type) {
      const el = document.getElementById('cloudStatus');
      if (!el) return;
      el.textContent = text;
      if (type === 'ok') el.style.color = '#22c55e';
      else if (type === 'warn') el.style.color = '#f97316';
      else if (type === 'error') el.style.color = '#e74c3c';
      else el.style.color = '#999';
    }

    function updateAuthUI() {
      const openBtn = document.getElementById('authOpenBtn');
      const logoutBtn = document.getElementById('authLogoutBtn');
      const userSpan = document.getElementById('authUser');
      const saveBtn = document.getElementById('cloudSaveBtn');
      const loadBtn = document.getElementById('cloudLoadBtn');
      if (currentUser) {
        openBtn.style.display = 'none';
        logoutBtn.style.display = '';
        userSpan.style.display = '';
        userSpan.innerHTML = `已登录：<b>${escapeHtml(currentUser.email || '')}</b>`;
        saveBtn.disabled = false;
        loadBtn.disabled = false;
      } else {
        openBtn.style.display = '';
        logoutBtn.style.display = 'none';
        userSpan.style.display = 'none';
        userSpan.innerHTML = '';
        saveBtn.disabled = true;
        loadBtn.disabled = true;
        setCloudStatus('请先登录', 'muted');
      }
    }

    async function initSupabase() {
      try {
        supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
        supabaseClient.auth.onAuthStateChange((event, session) => {
          if (session && session.user) {
            const isNewLogin = !currentUser || currentUser.id !== session.user.id;
            currentUser = session.user;
            cloudReady = true;
            updateAuthUI();
            if (isNewLogin) pullFromCloud(true);
          } else {
            currentUser = null;
            cloudReady = false;
            updateAuthUI();
          }
        });
        const { data, error } = await supabaseClient.auth.getSession();
        if (error) throw error;
        if (data.session && data.session.user) {
          currentUser = data.session.user;
          cloudReady = true;
          updateAuthUI();
          await pullFromCloud(true);
        } else {
          updateAuthUI();
        }
      } catch (err) {
        console.error('Supabase init failed', err);
        setCloudStatus('云端连接失败：' + (err.message || err), 'error');
      }
    }

    // ===== 登录/注册弹窗 =====
    function showAuthModal() {
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.id = 'authModalOverlay';
      overlay.innerHTML = `
        <div class="modal-box">
          <div class="modal-title">登录 / 注册</div>
          <div class="modal-body">
            <div class="modal-message">
              邮箱需符合格式, 如 <b>mzc051@mzc051.com</b>。<br>
              请记住，换设备找回数据时需要用同一个邮箱登录
            </div>
            <div class="modal-field">
              <label>邮箱</label>
              <input class="modal-input" type="email" id="modalAuthEmail" placeholder="例如 xiaoming@example.com" autocomplete="username">
            </div>
            <div class="modal-field">
              <label>密码（至少 6 位）</label>
              <input class="modal-input" type="password" id="modalAuthPassword" placeholder="请输入密码" autocomplete="current-password">
            </div>
            <div class="modal-actions">
              <button class="modal-btn-secondary" id="modalAuthRegister">注册</button>
              <button class="modal-btn-ok" id="modalAuthLogin">登录</button>
            </div>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);
      const emailInput = overlay.querySelector('#modalAuthEmail');
      const pwdInput = overlay.querySelector('#modalAuthPassword');
      const loginBtn = overlay.querySelector('#modalAuthLogin');
      const regBtn = overlay.querySelector('#modalAuthRegister');
      setTimeout(() => emailInput.focus(), 50);
      function close() { overlay.remove(); document.removeEventListener('keydown', onKey); }
      function onKey(e) {
        if (e.key === 'Escape') { e.preventDefault(); close(); }
        else if (e.key === 'Enter') { e.preventDefault(); doLogin(); }
      }
      document.addEventListener('keydown', onKey);
      overlay.addEventListener('click', function(e){ if (e.target === overlay) close(); });

      async function doLogin() {
        const email = emailInput.value.trim();
        const password = pwdInput.value;
        if (!email || !password) { showAlert('提示', '请填写邮箱和密码'); return; }
        try {
          const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
          if (error) throw error;
          close();
          showAlert('登录成功', '已登录，正在同步云端数据...');
        } catch (err) {
          const msg = err.message || String(err);
          if (msg.includes('Invalid login credentials')) showAlert('登录失败', '邮箱或密码错误，请检查后重试。');
          else showAlert('登录失败', escapeHtml(msg));
        }
      }
      async function doRegister() {
        const email = emailInput.value.trim();
        const password = pwdInput.value;
        if (!email || !password) { showAlert('提示', '请填写邮箱和密码'); return; }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showAlert('提示', '邮箱格式不对，例如 xiaoming@example.com'); return; }
        if (password.length < 6) { showAlert('提示', '密码至少 6 位'); return; }
        try {
          const { data, error } = await supabaseClient.auth.signUp({ email, password });
          if (error) throw error;
          close();
          if (data.session) showAlert('注册成功', '已自动登录，正在同步云端数据...');
          else showAlert('注册成功', '请使用刚才的邮箱和密码登录。');
        } catch (err) {
          const msg = err.message || String(err);
          if (msg.includes('already registered') || msg.includes('User already registered')) showAlert('注册失败', '该邮箱已经注册过了，请直接登录。');
          else if (msg.includes('invalid format') || msg.includes('validate email')) showAlert('提示', '邮箱格式不对，例如 xiaoming@example.com');
          else if (msg.includes('Password should be')) showAlert('提示', '密码太简单或太短，请至少 6 位。');
          else showAlert('注册失败', escapeHtml(msg));
        }
      }
      loginBtn.addEventListener('click', doLogin);
      regBtn.addEventListener('click', doRegister);
    }

    async function logout() {
      showConfirm('退出登录', '确定退出当前账号吗？<br>本地数据不会删除。', async function(ok) {
        if (!ok) return;
        await supabaseClient.auth.signOut();
        currentUser = null;
        cloudReady = false;
        updateAuthUI();
      });
    }

    // ===== 云端同步 =====
    function collectLocalData() {
      const payload = {};
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key && key.startsWith('bang_') && key !== LOCAL_CHANGE_KEY) payload[key] = localStorage.getItem(key);
      }
      return payload;
    }

    function applyCloudData(cloudData, serverUpdatedAt) {
      Object.keys(cloudData).forEach(k => {
        if (k.startsWith('bang_') && k !== LOCAL_CHANGE_KEY) localStorage.setItem(k, cloudData[k]);
      });
      const ts = serverUpdatedAt ? new Date(serverUpdatedAt).getTime() : Date.now();
      setLocalChangeNow(ts);
      cloudLastUpdatedAt = serverUpdatedAt || new Date(ts).toISOString();
      setCloudStatus('已从云端同步', 'ok');
      reloadIframes();
    }

    async function saveToCloud(options) {
      const silent = options && options.silent;
      if (!cloudReady || !supabaseClient || !currentUser) {
        if (!silent) showAlert('未登录', '请先登录账号。');
        return false;
      }
      const payload = collectLocalData();
      if (Object.keys(payload).length === 0) {
        if (!silent) showAlert('提示', '当前没有任何可保存的数据');
        return false;
      }
      try {
        setCloudStatus('保存中...', 'ok');
        const nowIso = new Date().toISOString();
        const { data: existing, error: qErr } = await supabaseClient
          .from('bang_data').select('id').eq('user_id', currentUser.id).limit(1);
        if (qErr) throw qErr;
        if (existing && existing.length > 0) {
          const { error } = await supabaseClient
            .from('bang_data').update({ data: payload, updated_at: nowIso }).eq('id', existing[0].id);
          if (error) throw error;
        } else {
          const { error } = await supabaseClient
            .from('bang_data').insert({ user_id: currentUser.id, data: payload, updated_at: nowIso });
          if (error) throw error;
        }
        let serverTs = nowIso;
        try {
          const { data: rows } = await supabaseClient
            .from('bang_data').select('updated_at').eq('user_id', currentUser.id).limit(1);
          if (rows && rows[0] && rows[0].updated_at) serverTs = rows[0].updated_at;
        } catch(e) {}
        const tsMs = new Date(serverTs).getTime();
        setLocalChangeNow(tsMs);
        cloudLastUpdatedAt = serverTs;
        setCloudStatus('已保存到云端', 'ok');
        if (!silent) showAlert('保存成功', '当前数据已保存到云端。');
        return true;
      } catch (err) {
        console.error(err);
        setCloudStatus('保存失败', 'error');
        if (!silent) showAlert('保存失败', escapeHtml(err.message || String(err)));
        return false;
      }
    }

    // 登录/刷新自动对比：仅本地新时弹上传询问；云端新/一致/本地无时间戳静默用云端
    async function pullFromCloud(silent) {
      if (!cloudReady || !supabaseClient || !currentUser) return;
      if (syncInProgress) return;
      syncInProgress = true;
      try {
        setCloudStatus('正在对比云端数据...', 'ok');
        const { data, error } = await supabaseClient
          .from('bang_data').select('data, updated_at').eq('user_id', currentUser.id).limit(1);
        if (error) throw error;
        if (!data || data.length === 0 || !data[0].data || Object.keys(data[0].data).length === 0) {
          cloudLastUpdatedAt = null;
          setCloudStatus('云端为空，可点「云端保存」上传', 'muted');
          return;
        }
        const cloudData = data[0].data;
        const cloudUpdatedAt = data[0].updated_at;
        cloudLastUpdatedAt = cloudUpdatedAt;
        const cloudTs = cloudUpdatedAt ? new Date(cloudUpdatedAt).getTime() : 0;
        const localTs = getLocalChangeTs();

        // 本地无时间戳 / 云端新 / 一致 → 静默用云端
        if (localTs <= 0 || localTs <= cloudTs) {
          applyCloudData(cloudData, cloudUpdatedAt);
          return;
        }

        // 仅本地新 → 弹上传询问
        showUploadPrompt({ localTs, cloudTs, cloudUpdatedAt, cloudData });
      } catch (err) {
        console.error(err);
        setCloudStatus('云端同步失败', 'error');
      } finally {
        syncInProgress = false;
      }

    async function loadFromCloud(silent) {
      if (!cloudReady || !supabaseClient || !currentUser) {
        if (!silent) showAlert('未登录', '请先登录账号。');
        return;
      }
      try {
        setCloudStatus('读取中...', 'ok');
        const { data, error } = await supabaseClient
          .from('bang_data').select('data, updated_at').eq('user_id', currentUser.id).limit(1);
        if (error) throw error;
        if (!data || data.length === 0 || !data[0].data) {
          setCloudStatus('云端暂无数据', 'ok');
          if (!silent) showAlert('提示', '云端还没有保存过数据。');
          return;
        }
        const cloudData = data[0].data;
        const cloudUpdatedAt = data[0].updated_at;
        if (Object.keys(cloudData).length === 0) {
          setCloudStatus('云端数据为空', 'ok');
          if (!silent) showAlert('提示', '云端数据为空。');
          return;
        }
        applyCloudData(cloudData, cloudUpdatedAt);
        setCloudStatus('已从云端读取', 'ok');
        if (!silent) {
          showAlert('读取成功', '云端数据已写入本地，页面将刷新。', function() { location.reload(); });

    // ===== 账号管理 =====
    const ACCOUNTS_STORAGE_KEY = 'bang_global_accounts';
    const STORAGE_PREFIX = 'bang_';

    function loadGlobalAccounts() {
      try {
        const raw = localStorage.getItem(ACCOUNTS_STORAGE_KEY);
        if (raw) {
          const arr = JSON.parse(raw);
          if (Array.isArray(arr)) {
            return arr.filter(x => typeof x === 'string' && x.trim() !== '')
                      .map(x => x.trim().replace(/\s+/g, ' '));
          }
        }
      } catch(e) {}
      return [];
    }
    function saveGlobalAccounts(arr) {
      localStorage.setItem(ACCOUNTS_STORAGE_KEY, JSON.stringify(arr));
      setLocalChangeNow();
    }
    let globalAccounts = loadGlobalAccounts();

    function parseNames(input) {
      if (!input || typeof input !== 'string') return [];
      const parts = input.split(/[,，\s]+/);
      const seen = new Set();
      const result = [];
      parts.forEach(p => {
        const name = p.trim().replace(/\s+/g, ' ');
        if (name && !seen.has(name)) { seen.add(name); result.push(name); }
      });
      return result;
    }

    function broadcastAccountsChanged() {
      document.querySelectorAll('.module-card iframe').forEach(iframe => {
        try {
          iframe.contentWindow.postMessage({ type: 'accounts-changed', accounts: globalAccounts }, '*');
        } catch(e) {}
      });
    }

    function updateGlobalCount() {
      const el = document.getElementById('globalAccountCount');
      if (el) el.textContent = globalAccounts.length;
    }

    function addGlobalAccounts(inputEl) {
      const names = parseNames(inputEl.value);
      if (names.length === 0) { inputEl.value = ''; return; }
      const existing = new Set(globalAccounts);
      const added = [], skipped = [];
      names.forEach(name => {
        if (existing.has(name)) skipped.push(name);
        else { existing.add(name); globalAccounts.push(name); added.push(name); }
      });
      if (added.length) {
        saveGlobalAccounts(globalAccounts);
        updateGlobalCount();
        broadcastAccountsChanged();
      }
      inputEl.value = '';
      if (skipped.length) showAlert('账号已存在', `以下账号已存在，已跳过：<br>${skipped.map(escapeHtml).join('、')}`);
    }

    function clearGlobalAccounts() {
      if (globalAccounts.length === 0) { showAlert('提示', '当前已经没有账号了'); return; }
      showConfirm('清空账号', '确定要清空所有打榜账号吗？<br>各模块中对应的账号数据也会被移除，此操作不可撤销。', function(ok) {
        if (!ok) return;
        globalAccounts = [];
        saveGlobalAccounts(globalAccounts);
        updateGlobalCount();
        broadcastAccountsChanged();
      });
    }

    function importAllData(file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const parsed = JSON.parse(e.target.result);
          if (!parsed || typeof parsed !== 'object' || !parsed.data || typeof parsed.data !== 'object') {
            showAlert('导入失败', '文件格式不正确：缺少 data 字段');
            return;
          }
          const dataObj = parsed.data;
          const keys = Object.keys(dataObj);
          if (keys.length === 0) { showAlert('导入失败', '文件中没有任何数据'); return; }
          const bangKeys = keys.filter(k => k.startsWith(STORAGE_PREFIX) && k !== LOCAL_CHANGE_KEY);
          if (bangKeys.length === 0) { showAlert('导入失败', '文件中没有找到本应用的数据（未找到 bang_ 开头的键）'); return; }
          let summary = `将导入 <b>${bangKeys.length}</b> 项数据，覆盖当前设备的对应数据。<br><br>包含：<br>`;
          bangKeys.slice(0, 8).forEach(k => { summary += `- ${escapeHtml(k)}<br>`; });
          if (bangKeys.length > 8) summary += `- ……等共 ${bangKeys.length} 项<br>`;
          summary += '<br>确定要导入吗？当前设备的相关数据会被覆盖，此操作不可撤销。';
          showConfirm('导入全部数据', summary, function(ok) {
            if (!ok) return;
            bangKeys.forEach(k => {
              const v = dataObj[k];
              localStorage.setItem(k, typeof v === 'string' ? v : JSON.stringify(v));
            });
            setLocalChangeNow();
            showAlert('导入成功', '数据已导入，页面将刷新以加载新数据。', function() { location.reload(); });
          });
        } catch (err) {
          console.error(err);
          showAlert('导入失败', '解析失败：' + escapeHtml(err.message));
        }
      };
      reader.onerror = function() { showAlert('读取失败', '读取文件失败'); };

    // ===== 导出 PNG =====
    const MODULE_TITLES = {
      power: '电力（盲盒CD：4h）',
      youni: '由你积分（>112）',
      coin: '金币（>48w）',
      play: '刷播'

    function requestModuleCapture(iframe) {
      return new Promise((resolve) => {
        let finished = false;
        const timeout = setTimeout(() => {
          if (!finished) { finished = true; resolve(null); }
        }, 8000);
        function onMsg(e) {
          if (!e.data || e.data.type !== 'capture-result') return;
          finished = true;
          clearTimeout(timeout);
          window.removeEventListener('message', onMsg);
          resolve(e.data.dataURL || null);
        }
        window.addEventListener('message', onMsg);
        try { iframe.contentWindow.postMessage({ type: 'capture' }, '*'); }
        catch(err) {
          finished = true;
          clearTimeout(timeout);
          window.removeEventListener('message', onMsg);
          resolve(null);
        }
      });
    }

    async function exportPageAsPng() {
      const btn = document.getElementById('exportPngBtn');
      btn.disabled = true;
      btn.textContent = '生成中...';
      const grid = document.getElementById('moduleGrid');
      const isMobile = window.matchMedia('(max-width: 900px)').matches;
      let prevActiveModule = null;
      if (isMobile) {
        const activeCard = document.querySelector('.module-card.active');
        if (activeCard) prevActiveModule = activeCard.dataset.module;
        grid.querySelectorAll('.module-card').forEach(c => c.classList.add('force-show'));
        await new Promise(r => setTimeout(r, 200));
      }
      try {
        const title = document.getElementById('exportTitle').textContent;
        const subtitle = document.getElementById('exportSubtitle').textContent;
        const cards = document.querySelectorAll('.module-card');
        const results = [];
        for (let i = 0; i < cards.length; i++) {
          const card = cards[i];
          const mod = card.dataset.module;
          const iframe = card.querySelector('iframe');
          let dataURL = null;
          if (iframe) dataURL = await requestModuleCapture(iframe);
          results.push({ mod, title: MODULE_TITLES[mod] || mod, dataURL });
        }
        const scale = 4;
        const gap = 12 * scale;
        const padding = 32 * scale;
        const titleH = 24 * scale;
        const subtitleH = 16 * scale;
        const cardTitleH = 20 * scale;
        const colW = 360 * scale;
        const loadedImgs = [];
        for (let i = 0; i < results.length; i++) {
          const r = results[i];
          if (r.dataURL) {
            try {
              const img = await loadImage(r.dataURL);
              loadedImgs.push({ img, drawH: colW * (img.height / img.width) });
            } catch(e) { loadedImgs.push({ img: null, drawH: 200 * scale }); }
          } else {
            loadedImgs.push({ img: null, drawH: 200 * scale });
          }
        }
        const rowHeights = loadedImgs.map(item => item.drawH + cardTitleH);
        const rows = rowHeights.length;
        const totalW = padding * 2 + colW;
        let totalH = padding * 2 + titleH + subtitleH;
        rowHeights.forEach(h => { totalH += h; });
        totalH += gap * (rows - 1);

        const canvas = document.createElement('canvas');
        canvas.width = totalW;
        canvas.height = totalH;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#faf7f9';
        ctx.fillRect(0, 0, totalW, totalH);
        ctx.fillStyle = '#ea3690';
        ctx.font = `bold ${16 * scale}px system-ui, sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        ctx.fillText(title, totalW / 2, padding);
        ctx.fillStyle = '#999';
        ctx.font = `${8 * scale}px system-ui, sans-serif`;
        ctx.fillText(subtitle, totalW / 2, padding + titleH);

        let currentY = padding + titleH + subtitleH;
        for (let row = 0; row < rows; row++) {
          const rowH = rowHeights[row];
          const r = results[row];
          const x = padding;
          const y = currentY;
          ctx.fillStyle = '#fff';
          roundRect(ctx, x, y, colW, rowH, 6 * scale);
          ctx.fill();
          ctx.strokeStyle = 'rgba(234,54,144,0.15)';
          ctx.lineWidth = 1 * scale;
          roundRect(ctx, x, y, colW, rowH, 6 * scale);
          ctx.stroke();
          ctx.fillStyle = '#ea3690';
          roundRectTop(ctx, x, y, colW, cardTitleH, 6 * scale);
          ctx.fill();
          ctx.fillStyle = '#fff';
          ctx.font = `bold ${8 * scale}px system-ui, sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(r.title, x + colW / 2, y + cardTitleH / 2);
          if (r.dataURL) {
            try {
              const img = await loadImage(r.dataURL);
              const contentY = y + cardTitleH;
              const contentH = rowH - cardTitleH;
              const imgRatio = img.width / img.height;
              const boxRatio = colW / contentH;
              let drawW, drawH, drawX, drawY;
              if (imgRatio > boxRatio) { drawW = colW; drawH = colW / imgRatio; drawX = x; drawY = contentY; }
              else { drawH = contentH; drawW = contentH * imgRatio; drawX = x + (colW - drawW) / 2; drawY = contentY; }
              ctx.drawImage(img, drawX, drawY, drawW, drawH);
            } catch(err) {}
          } else {
            ctx.fillStyle = '#bbb';
            ctx.font = `${12 * scale}px system-ui, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('（无法获取截图）', x + colW / 2, y + cardTitleH + (rowH - cardTitleH) / 2);
          }
          currentY += rowH + gap;
        }

        const wmText = 'mzc051';
        const wmFontSize = 28 * scale;
        ctx.save();
        ctx.font = `900 ${wmFontSize}px system-ui, sans-serif`;
        ctx.fillStyle = 'rgba(234, 54, 144, 0.08)';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const wmStepX = 200 * scale;
        const wmStepY = 120 * scale;
        for (let y = -wmStepY; y < canvas.height + wmStepY; y += wmStepY) {
          for (let x = -wmStepX; x < canvas.width + wmStepX; x += wmStepX) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(-25 * Math.PI / 180);
            ctx.fillText(wmText, 0, 0);
            ctx.restore();
          }
        }
        ctx.restore();
        const a = document.createElement('a');
        a.href = canvas.toDataURL('image/png');
        a.download = `打榜截图_${todayStr()}.png`;
        a.click();
        showAlert('导出成功', 'PNG 已生成，账号已统一打码为 ***。');
      } catch(err) {
        console.error(err);
        showAlert('导出失败', escapeHtml(err.message || String(err)));
      } finally {
        if (isMobile) {
          grid.querySelectorAll('.module-card').forEach(c => c.classList.remove('force-show'));
          const cards = document.querySelectorAll('.module-card');
          cards.forEach(c => c.classList.remove('active'));
          const restore = document.querySelector(`.module-card[data-module="${prevActiveModule || 'power'}"]`);
          if (restore) restore.classList.add('active');
          setTimeout(() => {
            cards.forEach(c => {
              if (c.classList.contains('active')) {
                const iframe = c.querySelector('iframe');
                if (iframe) {
                  try { iframe.contentWindow.postMessage({ type: 'accounts-changed', accounts: globalAccounts }, '*'); } catch(e) {}
                }
              }
            });
          }, 50);
        }
        btn.disabled = false;
        btn.textContent = '导出 PNG';
      }
    }

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = src;
      });
    }
    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }
    function roundRectTop(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h);
      ctx.lineTo(x, y + h);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    const IFRAME_MODULE_MAP = {
      '电力（盲盒CD：4h）': 'power',
      '由你积分（>112）': 'youni',
      '金币（>48w）': 'coin',
      '刷播': 'play'
    };
    const MODULE_IFRAME_MAP = {};
    document.querySelectorAll('.module-card iframe').forEach(iframe => {
      const title = iframe.getAttribute('title');
      const moduleName = IFRAME_MODULE_MAP[title] || title;
      MODULE_IFRAME_MAP[moduleName] = iframe;
    });
    const moduleHeights = {};

    function applyUniformHeight() {
      const values = Object.values(moduleHeights).filter(h => typeof h === 'number' && h > 0);
      if (values.length === 0) return;
      const maxH = Math.max.apply(null, values);
      Object.keys(MODULE_IFRAME_MAP).forEach(name => {
        const iframe = MODULE_IFRAME_MAP[name];
        if (iframe) iframe.style.height = maxH + 'px';
      });
    }

    // ===== 统一弹窗 =====
    let pendingModal = null;

    function showModal(payload, sourceWindow, requestId) {
      closeGlobalModal(null, false);
      pendingModal = { source: sourceWindow, requestId: requestId };
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.id = 'globalModalOverlay';
      const title = payload.title || '提示';
      const messageHtml = payload.messageHtml || escapeHtml(payload.message || '');
      const showInput = payload.showInput === true;
      const okText = payload.okText || '确定';
      const cancelText = payload.cancelText || '取消';
      const forceChoose = payload.forceChoose === true;
      const customActions = Array.isArray(payload.customActions) ? payload.customActions : null;

      let actionsHtml = '';
      if (customActions) {
        actionsHtml = customActions.map(a =>
          `<button class="${a.cls || 'modal-btn-ok'}" data-action="${escapeHtml(a.id)}">${escapeHtml(a.text)}</button>`
        ).join('');
      } else {
        actionsHtml = `${payload.showCancel === false ? '' : `<button class="modal-btn-cancel">${escapeHtml(cancelText)}</button>`}
          <button class="modal-btn-ok">${escapeHtml(okText)}</button>`;
      }

      overlay.innerHTML = `
        <div class="modal-box">
          <div class="modal-title">${escapeHtml(title)}</div>
          <div class="modal-body">
            ${messageHtml ? `<div class="modal-message">${messageHtml}</div>` : ''}
            ${showInput ? `<input class="modal-input" type="text" inputmode="numeric" placeholder="${escapeHtml(payload.placeholder || '')}" value="${escapeHtml(payload.defaultValue || '')}">` : ''}
            <div class="modal-actions">${actionsHtml}</div>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);
      const input = overlay.querySelector('.modal-input');
      if (input) setTimeout(() => { input.focus(); input.select(); }, 50);

      function finish(result) {
        const pm = pendingModal;
        pendingModal = null;
        overlay.remove();
        document.removeEventListener('keydown', onKey);
        if (pm && pm.source) {
          try { pm.source.postMessage({ type: 'modal-result', requestId: pm.requestId, value: result }, '*'); } catch(e) {}
        } else if (payload.onResult) {
          payload.onResult(result);
        }
      }
      function confirm() {
        const val = input ? input.value : '';
        finish({ confirmed: true, value: val, action: 'ok' });
      }
      function cancel() {
        if (forceChoose) return;
        finish({ confirmed: false, value: null, action: 'cancel' });
      }

      overlay.querySelectorAll('.modal-actions button').forEach(btn => {
        btn.addEventListener('click', function() {
          const action = this.dataset.action;
          if (action) {
            const val = input ? input.value : '';
            finish({ confirmed: true, value: val, action: action });
          } else if (this.classList.contains('modal-btn-ok')) {
            confirm();
          } else {
            cancel();
          }
        });
      });

      overlay.addEventListener('click', function(e){
        if (e.target === overlay && !forceChoose) cancel();
      });
      function onKey(e) {
        if (e.key === 'Escape') { e.preventDefault(); if (!forceChoose) cancel(); }
        else if (e.key === 'Enter') { e.preventDefault(); confirm(); }
      }
      document.addEventListener('keydown', onKey);
    }

    function closeGlobalModal(result, notify) {
      const overlay = document.getElementById('globalModalOverlay');
      if (overlay) overlay.remove();
      const pm = pendingModal;
      pendingModal = null;
      if (pm && notify && pm.source) {
        try { pm.source.postMessage({ type: 'modal-result', requestId: pm.requestId, value: result }, '*'); } catch(e) {}
      }
    }

    function showAlert(title, messageHtml, onClose) {
      showModal({
        title: title, messageHtml: messageHtml, showInput: false, showCancel: false,
        okText: '知道了',
        onResult: function() { if (onClose) onClose(); }
      }, null, '');
    }
    function showConfirm(title, messageHtml, onResult) {
      showModal({
        title: title, messageHtml: messageHtml, showInput: false, showCancel: true,
        okText: '确定', cancelText: '取消',
        onResult: function(result) { if (onResult) onResult(!!(result && result.confirmed)); }
      }, null, '');
    }

    function escapeHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    window.addEventListener('message', function(e) {
      if (!e.data) return;
      if (e.data.type === 'show-modal') {
        showModal(e.data.payload || {}, e.source, e.data.requestId || '');
        return;
      }
      if (e.data.type === 'delete-account') {
        const name = e.data.account;
        if (!name) return;
        const idx = globalAccounts.indexOf(name);
        if (idx === -1) return;
        showConfirm('删除打榜账号', `确定删除打榜账号「<b>${escapeHtml(name)}</b>」吗？<br>所有模块中该账号的数据都会被清除。`, function(ok) {
          if (!ok) return;
          globalAccounts.splice(idx, 1);
          saveGlobalAccounts(globalAccounts);
          updateGlobalCount();
          broadcastAccountsChanged();
        });
        return;
      }
      if (e.data.type === 'resize') {
        const moduleName = e.data.module;
        const h = Number(e.data.height) || 0;
        if (!moduleName || h <= 0) return;
        moduleHeights[moduleName] = h;
        applyUniformHeight();
        return;
      }
      if (e.data.type === 'dirty') {
        setLocalChangeNow();
        return;
      }
    });

    function syncIframeHeightFromDoc(iframe, moduleName) {
      try {
        const doc = iframe.contentWindow.document;
        const h = Math.max(
          doc.body.scrollHeight, doc.documentElement.scrollHeight,
          doc.body.offsetHeight, doc.documentElement.offsetHeight
        );
        if (h > 0) {
          moduleHeights[moduleName] = h;
          applyUniformHeight();
        }
      } catch (err) {}
    }

    document.querySelectorAll('.module-card iframe').forEach(iframe => {
      const title = iframe.getAttribute('title');
      const moduleName = IFRAME_MODULE_MAP[title] || title;
      iframe.addEventListener('load', function() {
        try { this.contentWindow.postMessage({ type: 'accounts-changed', accounts: globalAccounts }, '*'); } catch(e) {}
        syncIframeHeightFromDoc(this, moduleName);
        setTimeout(() => syncIframeHeightFromDoc(this, moduleName), 300);
      });
    });

    initAuthBar();
    initGlobalToolbar();
    initBackupToolbar();
    initModuleTabs();
    initSupabase();
  </script>
</body>
</html>
