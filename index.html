<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>打榜数据录入 · 汇总</title>
<link rel="stylesheet" href="common.css">
<style>
  body {
    display: block;
    background: #faf7f9;
    min-height: 100vh;
    padding: 6px;
    overflow: auto;
  }
  h1 {
    text-align: center;
    color: #ea3690;
    font-size: 18px;
    margin: 22px 0 10px;
  }
  .subtitle {
    text-align: center;
    color: #999;
    font-size: 12px;
    margin-bottom: 12px;
  }

  .global-toolbar {
    max-width: 1600px;
    margin: 0 auto 14px;
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 3px 10px rgba(234,54,144,0.07);
    border: 1px solid rgba(234,54,144,0.10);
    padding: 10px 12px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }
  .global-toolbar .label {
    font-size: 12px; font-weight: bold; color: #ea3690;
    white-space: nowrap; margin-right: 2px;
  }
  .global-toolbar input.new-account {
    flex: 1 1 260px; min-width: 200px; height: 32px; padding: 0 10px;
    border: 1px dashed #f0d6e4; border-radius: 8px; background: #fdf7fa;
    color: #555; font-size: 12px; font-family: inherit; outline: none; transition: 0.15s;
  }
  .global-toolbar input.new-account:focus {
    border-color: #ea3690; border-style: solid; background: #fff;
    box-shadow: 0 0 0 2px rgba(234,54,144,0.12);
  }
  .global-toolbar input.new-account::placeholder { color: #bbb; }
  .global-toolbar button {
    height: 32px; padding: 0 14px; border-radius: 16px;
    border: 1px solid rgba(234,54,144,0.35); background: white; color: #ea3690;
    font-size: 12px; font-weight: bold; cursor: pointer; transition: all 0.2s ease;
    outline: none; font-family: inherit; white-space: nowrap;
  }
  .global-toolbar button:hover { background: rgba(234,54,144,0.06); }
  .global-toolbar button.danger { border-color: rgba(231,76,60,0.4); color: #e74c3c; }
  .global-toolbar button.danger:hover { background: rgba(231,76,60,0.06); }
  .global-toolbar .count { font-size: 11px; color: #999; white-space: nowrap; margin-left: auto; }
  .global-toolbar .count b { color: #ea3690; }

  .backup-toolbar {
    max-width: 1600px;
    margin: 0 auto 14px;
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 3px 10px rgba(234,54,144,0.07);
    border: 1px solid rgba(234,54,144,0.10);
    padding: 10px 12px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }
  .backup-toolbar .label {
    font-size: 12px; font-weight: bold; color: #ea3690;
    white-space: nowrap; margin-right: 2px;
  }
  .backup-toolbar button {
    height: 32px; padding: 0 14px; border-radius: 16px;
    border: 1px solid rgba(234,54,144,0.35); background: white; color: #ea3690;
    font-size: 12px; font-weight: bold; cursor: pointer; transition: all 0.2s ease;
    outline: none; font-family: inherit; white-space: nowrap;
  }
  .backup-toolbar button:hover { background: rgba(234,54,144,0.06); }
  .backup-toolbar button.danger { border-color: rgba(231,76,60,0.4); color: #e74c3c; }
  .backup-toolbar button.danger:hover { background: rgba(231,76,60,0.06); }
  .backup-toolbar .hint { font-size: 11px; color: #999; white-space: nowrap; margin-left: auto; }

  .module-tabs {
    display: none;
    max-width: 1600px;
    margin: 0 auto 10px;
    gap: 0;
    flex-wrap: nowrap;
    overflow: hidden;
    background: #fff;
    border: 1px solid rgba(234,54,144,0.35);
    border-radius: 18px;
    padding: 3px;
    box-shadow: 0 2px 8px rgba(234,54,144,0.06);
  }
  .module-tab-btn {
    flex: 1;
    min-width: 0;
    padding: 7px 6px;
    border-radius: 15px;
    border: none;
    background: transparent;
    color: #ea3690;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.2s ease;
    outline: none;
    font-family: inherit;
    white-space: nowrap;
  }
  .module-tab-btn.active {
    background: #ea3690;
    color: #fff;
    box-shadow: 0 2px 6px rgba(234,54,144,0.25);
  }

  .module-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    width: 100%;
    max-width: 1600px;
    margin: 0 auto 40px;
    align-items: stretch;
  }
  .module-card {
    background: white;
    border-radius: 10px;
    box-shadow: 0 3px 10px rgba(234,54,144,0.07);
    border: 1px solid rgba(234,54,144,0.10);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .module-card .module-title {
    background: #ea3690; color: #fff; font-size: 13px; font-weight: bold;
    padding: 7px 14px; text-align: center; flex-shrink: 0;
  }
  .module-card iframe {
    width: 100%;
    border: 0;
    display: block;
    background: #fff;
    height: 420px;
    min-height: 120px;
  }

  @media (max-width: 900px) {
    .module-tabs { display: flex; }
    .module-grid {
      display: block;
      margin-bottom: 30px;
    }
    .module-card {
      display: none;
      margin-bottom: 0;
    }
    .module-card.active {
      display: flex;
    }
    h1 { font-size: 16px; margin: 16px 0 8px; }
    .subtitle { margin-bottom: 10px; }
    .global-toolbar input.new-account { flex-basis: 100%; }
    .global-toolbar .count { margin-left: 0; width: 100%; text-align: right; }
    .backup-toolbar .hint { margin-left: 0; width: 100%; text-align: right; }
  }

  #importJsonInput { display: none; }

  /* ===== 统一弹窗（标题无背景色、粉色文字） ===== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 99999;
    padding: 16px;
    animation: fadeIn 0.15s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .modal-box {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 10px 40px rgba(234,54,144,0.2);
    border: 1px solid rgba(234,54,144,0.15);
    max-width: 360px;
    width: 100%;
    overflow: hidden;
    animation: popIn 0.18s ease;
  }
  @keyframes popIn {
    from { transform: scale(0.95); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .modal-title {
    background: transparent;
    color: #ea3690;
    font-size: 15px;
    font-weight: bold;
    padding: 16px 16px 0 16px;
    text-align: center;
  }

  .modal-body {
    padding: 12px 16px 16px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .modal-message {
    font-size: 12px;
    color: #666;
    line-height: 1.6;
    text-align: center;
  }
  .modal-message .hint {
    font-size: 11px;
    color: #999;
  }

  .modal-input {
    width: 100%;
    height: 38px;
    padding: 0 12px;
    border: 1px solid #f0d6e4;
    border-radius: 8px;
    background: #fdf7fa;
    color: #333;
    font-size: 16px;
    font-family: inherit;
    outline: none;
    text-align: center;
    font-weight: bold;
    letter-spacing: 1px;
    transition: 0.15s;
  }
  .modal-input:focus {
    border-color: #ea3690;
    background: #fff;
    box-shadow: 0 0 0 2px rgba(234,54,144,0.12);
  }

  .modal-actions {
    display: flex;
    gap: 8px;
  }
  .modal-actions button {
    flex: 1;
    height: 38px;
    border-radius: 19px;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s ease;
    outline: none;
  }
  .modal-btn-cancel {
    border: 1px solid rgba(234,54,144,0.35);
    background: #fff;
    color: #ea3690;
  }
  .modal-btn-cancel:hover { background: rgba(234,54,144,0.06); }
  .modal-btn-ok {
    border: 1px solid #ea3690;
    background: #ea3690;
    color: #fff;
    box-shadow: 0 3px 10px rgba(234,54,144,0.25);
  }
  .modal-btn-ok:hover { background: #d42f80; border-color: #d42f80; }
</style>
</head>
<body>
  <h1>打榜数据录入</h1>
  <div class="subtitle">账号统一管理 · 多模块独立数据</div>

  <div class="global-toolbar">
    <span class="label">统一账号</span>
    <input class="new-account" type="text" id="globalNewAccount"
           placeholder="输入账号名，逗号或空格分隔可一次新增多个，按回车确认">
    <button id="globalAddBtn">新增</button>
    <button id="globalClearAccountsBtn" class="danger">清空账号</button>
    <span class="count">当前账号：<b id="globalAccountCount">0</b> 个</span>
  </div>

  <div class="backup-toolbar">
    <span class="label">数据备份</span>
    <button id="exportAllBtn">导出全部数据</button>
    <button id="importAllBtn">导入全部数据</button>
    <input type="file" id="importJsonInput" accept=".json,application/json">
    <span class="hint">换设备时：旧设备导出 JSON → 传到新设备 → 新设备导入</span>
  </div>

  <div class="module-tabs" id="moduleTabs">
    <button class="module-tab-btn active" data-module="power">电力</button>
    <button class="module-tab-btn" data-module="youni">由你积分</button>
    <button class="module-tab-btn" data-module="coin">金币</button>
    <button class="module-tab-btn" data-module="play">刷播</button>
  </div>

  <div class="module-grid">
    <div class="module-card active" data-module="power">
      <div class="module-title">电力（每 4 小时一轮）</div>
      <iframe src="power.html" title="电力"></iframe>
    </div>
    <div class="module-card" data-module="youni">
      <div class="module-title">由你积分</div>
      <iframe src="youni.html" title="由你积分"></iframe>
    </div>
    <div class="module-card" data-module="coin">
      <div class="module-title">金币</div>
      <iframe src="coin.html" title="金币"></iframe>
    </div>
    <div class="module-card" data-module="play">
      <div class="module-title">刷播</div>
      <iframe src="play.html" title="刷播"></iframe>
    </div>
  </div>

  <script>
    const ACCOUNTS_STORAGE_KEY = 'bang_global_accounts';
    const STORAGE_PREFIX = 'bang_';

    function loadGlobalAccounts() {
      try {
        const raw = localStorage.getItem(ACCOUNTS_STORAGE_KEY);
        if (raw) {
          const arr = JSON.parse(raw);
          if (Array.isArray(arr)) {
            return arr.filter(x => typeof x === 'string' && x.trim() !== '')
                      .map(x => x.trim().replace(/\s+/g, ' '));
          }
        }
      } catch(e) {}
      return [];
    }
    function saveGlobalAccounts(arr) {
      localStorage.setItem(ACCOUNTS_STORAGE_KEY, JSON.stringify(arr));
    }
    let globalAccounts = loadGlobalAccounts();

    function parseNames(input) {
      if (!input || typeof input !== 'string') return [];
      const parts = input.split(/[,，\s]+/);
      const seen = new Set();
      const result = [];
      parts.forEach(p => {
        const name = p.trim().replace(/\s+/g, ' ');
        if (name && !seen.has(name)) { seen.add(name); result.push(name); }
      });
      return result;
    }

    function broadcastAccountsChanged() {
      document.querySelectorAll('.module-card iframe').forEach(iframe => {
        try {
          iframe.contentWindow.postMessage({
            type: 'accounts-changed',
            accounts: globalAccounts
          }, '*');
        } catch(e) {}
      });
    }

    function updateGlobalCount() {
      const el = document.getElementById('globalAccountCount');
      if (el) el.textContent = globalAccounts.length;
    }

    function addGlobalAccounts(inputEl) {
      const names = parseNames(inputEl.value);
      if (names.length === 0) { inputEl.value = ''; return; }
      const existing = new Set(globalAccounts);
      const added = [], skipped = [];
      names.forEach(name => {
        if (existing.has(name)) skipped.push(name);
        else { existing.add(name); globalAccounts.push(name); added.push(name); }
      });
      if (added.length) {
        saveGlobalAccounts(globalAccounts);
        updateGlobalCount();
        broadcastAccountsChanged();
      }
      inputEl.value = '';
      if (skipped.length) {
        showAlert('账号已存在', `以下账号已存在，已跳过：<br>${skipped.map(escapeHtml).join('、')}`);
      }
    }

    function clearGlobalAccounts() {
      if (globalAccounts.length === 0) { showAlert('提示', '当前已经没有账号了'); return; }
      showConfirm('清空账号', '确定要清空所有统一账号吗？<br>各模块中对应的账号数据也会被移除，此操作不可撤销。', function(ok) {
        if (!ok) return;
        globalAccounts = [];
        saveGlobalAccounts(globalAccounts);
        updateGlobalCount();
        broadcastAccountsChanged();
      });
    }

    function initGlobalToolbar() {
      updateGlobalCount();
      const input = document.getElementById('globalNewAccount');
      const addBtn = document.getElementById('globalAddBtn');
      const clearBtn = document.getElementById('globalClearAccountsBtn');
      addBtn.addEventListener('click', () => addGlobalAccounts(input));
      input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') { e.preventDefault(); addGlobalAccounts(this); }
      });
      input.addEventListener('blur', function() {
        const el = this;
        setTimeout(() => { if (el.value.trim()) addGlobalAccounts(el); }, 100);
      });
      clearBtn.addEventListener('click', clearGlobalAccounts);
    }

    function initModuleTabs() {
      const tabs = document.querySelectorAll('.module-tab-btn');
      const cards = document.querySelectorAll('.module-card');
      tabs.forEach(btn => {
        btn.addEventListener('click', function() {
          const mod = this.dataset.module;
          tabs.forEach(b => b.classList.toggle('active', b === this));
          cards.forEach(c => c.classList.toggle('active', c.dataset.module === mod));
          setTimeout(() => {
            cards.forEach(c => {
              if (c.classList.contains('active')) {
                const iframe = c.querySelector('iframe');
                if (iframe) {
                  try { iframe.contentWindow.postMessage({ type: 'accounts-changed', accounts: globalAccounts }, '*'); } catch(e) {}
                }
              }
            });
          }, 50);
        });
      });
    }

    function todayStr() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    function exportAllData() {
      const payload = {};
      let count = 0;
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key && key.startsWith(STORAGE_PREFIX)) {
          payload[key] = localStorage.getItem(key);
          count++;
        }
      }
      if (count === 0) {
        showAlert('提示', '当前没有任何可导出的数据');
        return;
      }

      const exportObj = {
        app: '打榜数据录入',
        version: 1,
        exportedAt: new Date().toISOString(),
        data: payload
      };

      const json = JSON.stringify(exportObj, null, 2);
      const blob = new Blob([json], { type: 'application/json;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `打榜全部数据_${todayStr()}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importAllData(file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const text = e.target.result;
          const parsed = JSON.parse(text);
          if (!parsed || typeof parsed !== 'object' || !parsed.data || typeof parsed.data !== 'object') {
            showAlert('导入失败', '文件格式不正确：缺少 data 字段');
            return;
          }

          const dataObj = parsed.data;
          const keys = Object.keys(dataObj);
          if (keys.length === 0) {
            showAlert('导入失败', '文件中没有任何数据');
            return;
          }

          const bangKeys = keys.filter(k => k.startsWith(STORAGE_PREFIX));
          if (bangKeys.length === 0) {
            showAlert('导入失败', '文件中没有找到本应用的数据（未找到 bang_ 开头的键）');
            return;
          }

          let summary = `将导入 <b>${bangKeys.length}</b> 项数据，覆盖当前设备的对应数据。<br><br>包含：<br>`;
          bangKeys.slice(0, 8).forEach(k => { summary += `- ${escapeHtml(k)}<br>`; });
          if (bangKeys.length > 8) summary += `- ……等共 ${bangKeys.length} 项<br>`;
          summary += '<br>确定要导入吗？当前设备的相关数据会被覆盖，此操作不可撤销。';

          showConfirm('导入全部数据', summary, function(ok) {
            if (!ok) return;
            bangKeys.forEach(k => {
              const v = dataObj[k];
              localStorage.setItem(k, typeof v === 'string' ? v : JSON.stringify(v));
            });
            showAlert('导入成功', '数据已导入，页面将刷新以加载新数据。', function() {
              location.reload();
            });
          });
        } catch (err) {
          console.error(err);
          showAlert('导入失败', '解析失败：' + escapeHtml(err.message));
        }
      };
      reader.onerror = function() {
        showAlert('读取失败', '读取文件失败');
      };
      reader.readAsText(file, 'UTF-8');
    }

    function initBackupToolbar() {
      const exportBtn = document.getElementById('exportAllBtn');
      const importBtn = document.getElementById('importAllBtn');
      const fileInput = document.getElementById('importJsonInput');

      exportBtn.addEventListener('click', exportAllData);

      importBtn.addEventListener('click', () => {
        fileInput.value = '';
        fileInput.click();
      });

      fileInput.addEventListener('change', function(e) {
        const file = e.target.files && e.target.files[0];
        if (file) importAllData(file);
      });
    }

    const IFRAME_MODULE_MAP = {
      '电力（每 4 小时一轮）': 'power',
      '由你积分': 'youni',
      '金币': 'coin',
      '刷播': 'play'
    };
    const MODULE_IFRAME_MAP = {};
    document.querySelectorAll('.module-card iframe').forEach(iframe => {
      const title = iframe.getAttribute('title');
      const moduleName = IFRAME_MODULE_MAP[title] || title;
      MODULE_IFRAME_MAP[moduleName] = iframe;
    });

    const moduleHeights = {};

    function applyUniformHeight() {
      const values = Object.values(moduleHeights).filter(h => typeof h === 'number' && h > 0);
      if (values.length === 0) return;
      const maxH = Math.max.apply(null, values);
      Object.keys(MODULE_IFRAME_MAP).forEach(name => {
        const iframe = MODULE_IFRAME_MAP[name];
        if (iframe) iframe.style.height = maxH + 'px';
      });
    }

    // ===== 统一弹窗接口 =====
    let pendingModal = null;

    function showModal(payload, sourceWindow, requestId) {
      closeGlobalModal(null, false);
      pendingModal = { source: sourceWindow, requestId: requestId };

      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.id = 'globalModalOverlay';

      const title = payload.title || '提示';
      const messageHtml = payload.messageHtml || escapeHtml(payload.message || '');
      const showInput = payload.showInput === true;
      const okText = payload.okText || '确定';
      const cancelText = payload.cancelText || '取消';

      overlay.innerHTML = `
        <div class="modal-box">
          <div class="modal-title">${escapeHtml(title)}</div>
          <div class="modal-body">
            ${messageHtml ? `<div class="modal-message">${messageHtml}</div>` : ''}
            ${showInput ? `<input class="modal-input" type="text" inputmode="numeric" placeholder="${escapeHtml(payload.placeholder || '')}" value="${escapeHtml(payload.defaultValue || '')}">` : ''}
            <div class="modal-actions">
              ${payload.showCancel === false ? '' : `<button class="modal-btn-cancel">${escapeHtml(cancelText)}</button>`}
              <button class="modal-btn-ok">${escapeHtml(okText)}</button>
            </div>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);

      const input = overlay.querySelector('.modal-input');
      const btnOk = overlay.querySelector('.modal-btn-ok');
      const btnCancel = overlay.querySelector('.modal-btn-cancel');

      if (input) {
        setTimeout(() => { input.focus(); input.select(); }, 50);
      }

      function finish(result) {
        const pm = pendingModal;
        pendingModal = null;
        overlay.remove();
        document.removeEventListener('keydown', onKey);
        if (pm && pm.source) {
          try {
            pm.source.postMessage({
              type: 'modal-result',
              requestId: pm.requestId,
              value: result
            }, '*');
          } catch(e) {}
        } else if (payload.onResult) {
          payload.onResult(result);
        }
      }

      function confirm() {
        const val = input ? input.value : '';
        finish({ confirmed: true, value: val });
      }
      function cancel() {
        finish({ confirmed: false, value: null });
      }

      btnOk.addEventListener('click', confirm);
      if (btnCancel) btnCancel.addEventListener('click', cancel);
      overlay.addEventListener('click', function(e){
        if (e.target === overlay) cancel();
      });

      function onKey(e) {
        if (e.key === 'Escape') { e.preventDefault(); cancel(); }
        else if (e.key === 'Enter') { e.preventDefault(); confirm(); }
      }
      document.addEventListener('keydown', onKey);
    }

    function closeGlobalModal(result, notify) {
      const overlay = document.getElementById('globalModalOverlay');
      if (overlay) overlay.remove();
      const pm = pendingModal;
      pendingModal = null;
      if (pm && notify && pm.source) {
        try {
          pm.source.postMessage({
            type: 'modal-result',
            requestId: pm.requestId,
            value: result
          }, '*');
        } catch(e) {}
      }
    }

    // 父页面自己用的 alert / confirm
    function showAlert(title, messageHtml, onClose) {
      showModal({
        title: title,
        messageHtml: messageHtml,
        showInput: false,
        showCancel: false,
        okText: '知道了',
        onResult: function() { if (onClose) onClose(); }
      }, null, '');
    }

    function showConfirm(title, messageHtml, onResult) {
      showModal({
        title: title,
        messageHtml: messageHtml,
        showInput: false,
        showCancel: true,
        okText: '确定',
        cancelText: '取消',
        onResult: function(result) {
          // 关键修复：把 {confirmed, value} 转成布尔值再传给业务回调
          if (onResult) onResult(!!(result && result.confirmed));
        }
      }, null, '');
    }

    function escapeHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    window.addEventListener('message', function(e) {
      if (!e.data) return;

      if (e.data.type === 'show-modal') {
        showModal(e.data.payload || {}, e.source, e.data.requestId || '');
        return;
      }

      if (e.data.type === 'delete-account') {
        const name = e.data.account;
        if (!name) return;
        const idx = globalAccounts.indexOf(name);
        if (idx === -1) return;
        showConfirm('删除统一账号', `确定删除统一账号「<b>${escapeHtml(name)}</b>」吗？<br>所有模块中该账号的数据都会被清除。`, function(ok) {
          if (!ok) return;
          globalAccounts.splice(idx, 1);
          saveGlobalAccounts(globalAccounts);
          updateGlobalCount();
          broadcastAccountsChanged();
        });
        return;
      }

      if (e.data.type === 'resize') {
        const moduleName = e.data.module;
        const h = Number(e.data.height) || 0;
        if (!moduleName || h <= 0) return;
        moduleHeights[moduleName] = h;
        applyUniformHeight();
      }
    });

    function syncIframeHeightFromDoc(iframe, moduleName) {
      try {
        const doc = iframe.contentWindow.document;
        const h = Math.max(
          doc.body.scrollHeight,
          doc.documentElement.scrollHeight,
          doc.body.offsetHeight,
          doc.documentElement.offsetHeight
        );
        if (h > 0) {
          moduleHeights[moduleName] = h;
          applyUniformHeight();
        }
      } catch (err) {}
    }

    document.querySelectorAll('.module-card iframe').forEach(iframe => {
      const title = iframe.getAttribute('title');
      const moduleName = IFRAME_MODULE_MAP[title] || title;
      iframe.addEventListener('load', function() {
        try {
          this.contentWindow.postMessage({
            type: 'accounts-changed',
            accounts: globalAccounts
          }, '*');
        } catch(e) {}
        syncIframeHeightFromDoc(this, moduleName);
        setTimeout(() => syncIframeHeightFromDoc(this, moduleName), 300);
      });
    });

    initGlobalToolbar();
    initBackupToolbar();
    initModuleTabs();
  </script>
</body>
</html>
